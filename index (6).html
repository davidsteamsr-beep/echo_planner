<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ECHO Planner</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0a0a0a;
      --bg-card: #141414;
      --bg-elevated: #1c1c1c;
      --orange: #ff6b00;
      --text: #f2f2f2;
      --text-dim: #888;
      --border: #2a2a2a;
      --radius: 16px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #app {
      height: 100%;
      display: flex;
      flex-direction: column;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--border);
    }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-mark {
      width: 32px; height: 32px;
      background: var(--orange); color: #000;
      font-weight: 800; font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 8px;
    }
    .logo-text { font-weight: 600; font-size: 17px; letter-spacing: -0.3px; }
    .sub-badge {
      font-size: 11px; font-weight: 600;
      padding: 4px 10px; border-radius: 20px;
      background: var(--bg-elevated); color: var(--text-dim);
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .sub-badge.pro { background: var(--orange); color: #000; }
    .screen {
      display: none;
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px 100px;
      -webkit-overflow-scrolling: touch;
    }
    .screen.active { display: block; }
    .sections {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 8px;
    }
    .section-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 16px;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.1s;
      display: flex; flex-direction: column; gap: 8px;
      min-height: 120px;
    }
    .section-btn:active { transform: scale(0.97); border-color: var(--orange); }
    .section-btn .icon { font-size: 28px; }
    .section-btn .label { font-size: 15px; font-weight: 600; }
    .section-btn .stat { font-size: 13px; color: var(--text-dim); margin-top: auto; }
    .section-header {
      display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
    }
    .back-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--bg-elevated); border: none; color: var(--text);
      font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .section-header h2 { font-size: 20px; font-weight: 600; }
    .stats-row {
      display: flex; gap: 10px; overflow-x: auto;
      padding-bottom: 12px; margin-bottom: 8px;
    }
    .stat-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 16px;
      min-width: 110px; flex-shrink: 0;
    }
    .stat-card .val { font-size: 18px; font-weight: 700; color: var(--orange); }
    .stat-card .lbl { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
    .list { display: flex; flex-direction: column; gap: 8px; }
    .list-item {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px 16px;
      display: flex; align-items: center; gap: 12px;
    }
    .list-item .main { flex: 1; min-width: 0; }
    .list-item .title {
      font-size: 15px; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .list-item .meta { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
    .list-item .amount { font-weight: 700; color: var(--orange); font-size: 15px; }
    .list-item.done .title { text-decoration: line-through; color: var(--text-dim); }
    .checkbox {
      width: 22px; height: 22px; border-radius: 6px;
      border: 2px solid var(--border); background: transparent;
      cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; color: #000;
    }
    .checkbox.checked { background: var(--orange); border-color: var(--orange); }
    .empty { text-align: center; color: var(--text-dim); padding: 40px 20px; font-size: 14px; }
    .arthur-btn {
      position: fixed;
      bottom: calc(24px + var(--safe-bottom));
      left: 50%; transform: translateX(-50%);
      width: 64px; height: 64px; border-radius: 50%;
      background: var(--orange); border: none; color: #000;
      font-size: 24px; font-weight: 800; cursor: pointer;
      box-shadow: 0 4px 24px rgba(255, 107, 0, 0.45);
      z-index: 100;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s;
    }
    .arthur-btn:active { transform: translateX(-50%) scale(0.92); }
    .arthur-btn.hidden { display: none; }
    #chat-screen { display: none; flex-direction: column; padding: 0; }
    #chat-screen.active { display: flex; }
    #chat-screen .section-header {
      padding: 16px 20px 12px; margin: 0;
      border-bottom: 1px solid var(--border);
    }
    .chat-messages {
      flex: 1; overflow-y: auto; padding: 16px 20px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .msg {
      max-width: 85%; padding: 10px 14px; border-radius: 16px;
      font-size: 14px; line-height: 1.4;
    }
    .msg.user {
      align-self: flex-end; background: var(--orange); color: #000;
      border-bottom-right-radius: 4px;
    }
    .msg.bot {
      align-self: flex-start; background: var(--bg-elevated);
      border-bottom-left-radius: 4px;
    }
    .chat-input-wrap {
      display: flex; gap: 8px;
      padding: 12px 16px calc(12px + var(--safe-bottom));
      border-top: 1px solid var(--border); background: var(--bg);
    }
    #chatInput {
      flex: 1; background: var(--bg-elevated);
      border: 1px solid var(--border); border-radius: 24px;
      padding: 12px 18px; color: var(--text); font-size: 15px; outline: none;
    }
    #chatInput:focus { border-color: var(--orange); }
    #sendBtn {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--orange); border: none; color: #000;
      font-size: 18px; font-weight: 700; cursor: pointer;
    }
    .api-warning {
      background: #2a1a00; border: 1px solid var(--orange);
      border-radius: 12px; padding: 12px 14px; margin-bottom: 16px;
      font-size: 13px; color: #ffb366; line-height: 1.4;
    }
  </style>
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="logo">
        <div class="logo-mark">E</div>
        <span class="logo-text">ECHO Planner</span>
      </div>
      <div class="sub-badge" id="subBadge">Free</div>
    </header>

    <main id="dashboard" class="screen active">
      <div id="apiWarning" class="api-warning" style="display:none">
        Укажи адрес API бота в настройках (см. комментарий в коде).
      </div>
      <div class="sections">
        <button class="section-btn" data-section="finance">
          <span class="icon">💰</span>
          <span class="label">Финансы</span>
          <span class="stat" id="statFinance">—</span>
        </button>
        <button class="section-btn" data-section="calendar">
          <span class="icon">📅</span>
          <span class="label">Календарь</span>
          <span class="stat" id="statCalendar">—</span>
        </button>
        <button class="section-btn" data-section="tasks">
          <span class="icon">✅</span>
          <span class="label">Задачи</span>
          <span class="stat" id="statTasks">—</span>
        </button>
        <button class="section-btn" data-section="nutrition">
          <span class="icon">🍽</span>
          <span class="label">Питание</span>
          <span class="stat" id="statNutrition">—</span>
        </button>
      </div>
    </main>

    <main id="section-screen" class="screen">
      <div class="section-header">
        <button class="back-btn" id="backBtn">←</button>
        <h2 id="sectionTitle">Раздел</h2>
      </div>
      <div class="stats-row" id="sectionStats"></div>
      <div class="list" id="sectionList"></div>
    </main>

    <main id="chat-screen" class="screen">
      <div class="section-header">
        <button class="back-btn" id="chatBackBtn">←</button>
        <h2>ARTHUR</h2>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-wrap">
        <input type="text" id="chatInput" placeholder="Спроси ARTHUR..." autocomplete="off" />
        <button id="sendBtn">↑</button>
      </div>
    </main>

    <button id="arthurBtn" class="arthur-btn" title="ARTHUR"><span>A</span></button>
  </div>

  <script>
    // ============================================================
    //  НАСТРОЙКА: сюда вставь адрес, где крутится бот (FastAPI)
    //  Пример: "https://echo-planner.up.railway.app"
    //  Пока пусто — мини-приложение работает в демо-режиме
    // ============================================================
    const API_BASE = "";   // <-- поменяй на свой URL сервера бота

    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      try {
        tg.setHeaderColor("#0a0a0a");
        tg.setBackgroundColor("#0a0a0a");
      } catch(e) {}
    }

    const state = { data: null, currentSection: null };

    const $ = (s) => document.querySelector(s);
    const $$ = (s) => document.querySelectorAll(s);

    function initDataHeader() {
      return tg?.initData || "";
    }

    async function api(path, opts = {}) {
      if (!API_BASE) throw new Error("NO_API");
      const headers = {
        "Content-Type": "application/json",
        "X-Telegram-Init-Data": initDataHeader(),
        ...(opts.headers || {}),
      };
      const res = await fetch(API_BASE + path, { ...opts, headers });
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    function demoData() {
      return {
        stats: {
          finance: { month_spend: 0, avg_day: 0, count: 0 },
          calendar: { week_count: 0, nearest: null, total: 0 },
          tasks: { done: 0, total: 0, open: 0 },
          nutrition: { calories: 0, protein: 0, fat: 0, carbs: 0, meals_today: 0 },
          subscription: { active: false },
        },
        finance: [],
        calendar: [],
        tasks: [],
        nutrition: [],
      };
    }

    async function loadData() {
      try {
        if (!API_BASE) {
          $("#apiWarning").style.display = "block";
          state.data = demoData();
        } else {
          state.data = await api("/api/me");
          $("#apiWarning").style.display = "none";
        }
        renderDashboard();
      } catch (e) {
        console.error(e);
        state.data = demoData();
        $("#apiWarning").style.display = "block";
        renderDashboard();
      }
    }

    function renderDashboard() {
      const s = state.data.stats;
      $("#statFinance").textContent = s.finance.month_spend + " ₽";
      $("#statCalendar").textContent = s.calendar.week_count
        ? s.calendar.week_count + " на неделе"
        : "нет встреч";
      $("#statTasks").textContent = s.tasks.done + "/" + s.tasks.total;
      $("#statNutrition").textContent = s.nutrition.calories + " ккал";

      const badge = $("#subBadge");
      if (s.subscription && s.subscription.active) {
        badge.textContent = "PRO";
        badge.classList.add("pro");
      } else {
        badge.textContent = "Free";
        badge.classList.remove("pro");
      }
    }

    function showScreen(id) {
      $$(".screen").forEach((el) => el.classList.remove("active"));
      $("#" + id).classList.add("active");
      $("#arthurBtn").classList.toggle("hidden", id === "chat-screen");
    }

    function openSection(name) {
      state.currentSection = name;
      const titles = {
        finance: "Финансы",
        calendar: "Календарь",
        tasks: "Задачи",
        nutrition: "Питание",
      };
      $("#sectionTitle").textContent = titles[name];
      renderSection(name);
      showScreen("section-screen");
    }

    function renderSection(name) {
      const s = state.data.stats[name];
      const list = state.data[name] || [];
      const statsEl = $("#sectionStats");
      const listEl = $("#sectionList");

      let statsHtml = "";
      if (name === "finance") {
        statsHtml = 
          '<div class="stat-card"><div class="val">' + s.month_spend + ' ₽</div><div class="lbl">за месяц</div></div>' +
          '<div class="stat-card"><div class="val">' + s.avg_day + ' ₽</div><div class="lbl">в день</div></div>' +
          '<div class="stat-card"><div class="val">' + s.count + '</div><div class="lbl">записей</div></div>';
      } else if (name === "calendar") {
        const nearest = s.nearest ? (s.nearest.title || "Встреча") : "—";
        statsHtml = 
          '<div class="stat-card"><div class="val">' + s.week_count + '</div><div class="lbl">на неделе</div></div>' +
          '<div class="stat-card"><div class="val" style="font-size:14px">' + nearest + '</div><div class="lbl">ближайшая</div></div>';
      } else if (name === "tasks") {
        statsHtml = 
          '<div class="stat-card"><div class="val">' + s.done + '</div><div class="lbl">сделано</div></div>' +
          '<div class="stat-card"><div class="val">' + s.open + '</div><div class="lbl">открыто</div></div>';
      } else if (name === "nutrition") {
        statsHtml = 
          '<div class="stat-card"><div class="val">' + s.calories + '</div><div class="lbl">ккал</div></div>' +
          '<div class="stat-card"><div class="val">' + s.protein + '/' + s.fat + '/' + s.carbs + '</div><div class="lbl">Б / Ж / У</div></div>';
      }
      statsEl.innerHTML = statsHtml;

      if (!list.length) {
        listEl.innerHTML = '<div class="empty">Нет записей</div>';
        return;
      }

      listEl.innerHTML = list.map(function(item) {
        if (name === "finance") {
          return '<div class="list-item"><div class="main"><div class="title">' + esc(item.description || item.category || "Трата") + '</div><div class="meta">' + (item.date || "") + ' · ' + (item.category || "") + '</div></div><div class="amount">−' + item.amount + ' ₽</div></div>';
        }
        if (name === "calendar") {
          const dt = item.datetime ? item.datetime.replace("T", " ").slice(0, 16) : "";
          return '<div class="list-item"><div class="main"><div class="title">' + esc(item.title) + '</div><div class="meta">' + dt + '</div></div></div>';
        }
        if (name === "tasks") {
          const checked = item.done ? "checked" : "";
          const doneCls = item.done ? "done" : "";
          return '<div class="list-item ' + doneCls + '"><div class="checkbox ' + checked + '" data-id="' + item.id + '" onclick="toggleTask(\'' + item.id + '\', ' + (!item.done) + ')">' + (item.done ? "✓" : "") + '</div><div class="main"><div class="title">' + esc(item.title) + '</div><div class="meta">' + (item.due || "") + '</div></div></div>';
        }
        if (name === "nutrition") {
          return '<div class="list-item"><div class="main"><div class="title">' + esc(item.title) + '</div><div class="meta">' + (item.date || "") + ' · ' + (item.meal || "") + ' · ' + (item.calories || 0) + ' ккал</div></div></div>';
        }
        return "";
      }).join("");
    }

    function esc(s) {
      const d = document.createElement("div");
      d.textContent = s || "";
      return d.innerHTML;
    }

    async function toggleTask(id, done) {
      try {
        if (API_BASE) {
          await api("/api/task/toggle", {
            method: "POST",
            body: JSON.stringify({ task_id: id, done: done }),
          });
        }
        const t = state.data.tasks.find(function(x) { return x.id === id; });
        if (t) t.done = done;
        state.data.stats.tasks.done += done ? 1 : -1;
        state.data.stats.tasks.open += done ? -1 : 1;
        renderSection("tasks");
        renderDashboard();
      } catch (e) {
        console.error(e);
      }
    }

    function openChat() {
      showScreen("chat-screen");
      $("#chatInput").focus();
    }

    async function sendMessage() {
      const input = $("#chatInput");
      const q = input.value.trim();
      if (!q) return;
      input.value = "";

      const box = $("#chatMessages");
      box.innerHTML += '<div class="msg user">' + esc(q) + '</div>';
      box.scrollTop = box.scrollHeight;

      try {
        if (!API_BASE) {
          box.innerHTML += '<div class="msg bot">Нет записей. Подключи API бота.</div>';
        } else {
          const res = await api("/api/arthur", {
            method: "POST",
            body: JSON.stringify({ question: q }),
          });
          box.innerHTML += '<div class="msg bot">' + esc(res.answer) + '</div>';
        }
      } catch (e) {
        box.innerHTML += '<div class="msg bot">Сбой связи</div>';
      }
      box.scrollTop = box.scrollHeight;
    }

    $$(".section-btn").forEach(function(btn) {
      btn.addEventListener("click", function() { openSection(btn.dataset.section); });
    });
    $("#backBtn").addEventListener("click", function() { showScreen("dashboard"); });
    $("#chatBackBtn").addEventListener("click", function() { showScreen("dashboard"); });
    $("#arthurBtn").addEventListener("click", openChat);
    $("#sendBtn").addEventListener("click", sendMessage);
    $("#chatInput").addEventListener("keydown", function(e) {
      if (e.key === "Enter") sendMessage();
    });

    loadData();
  </script>
</body>
</html>
