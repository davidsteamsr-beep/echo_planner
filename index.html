<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#08090b" />
  <meta name="color-scheme" content="dark" />
  <title>ECHO Planner</title>
  <link rel="icon" type="image/svg+xml" href="public/favicon.svg" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ============================================================
       ECHO PLANNER — "AURORA" redesign
       airy glass · spectrum accents · spring motion
       ============================================================ */
    :root {
      --bg: #08090b;
      --bg-2: #0e0f12;
      --fg: #f4f5f7;
      --muted: #9a9da5;
      --faint: #646870;
      --violet: #6f747d;
      --violet-2: #d7dbe2;
      --coral: #aab0b9;
      --coral-2: #e1e5ea;
      --teal: #bcc5d1;
      --amber: #d5dae2;
      --lime: #e2e6ec;
      --line: rgba(255, 255, 255, .085);
      --line-soft: rgba(255, 255, 255, .055);
      --surface: rgba(255, 255, 255, .048);
      --surface-2: rgba(255, 255, 255, .075);
      --radius: 26px;
      --radius-sm: 18px;
      --font: "Onest", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --display: "Unbounded", "Onest", -apple-system, sans-serif;
      --font-chat: "Onest", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --ease: cubic-bezier(.22, 1, .36, 1);
      --spring: cubic-bezier(.34, 1.5, .64, 1);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #000; color: var(--fg);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overscroll-behavior: none;
    }
    body { user-select: none; }
    button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
    input, textarea { font-family: inherit; color: var(--fg); background: transparent; border: 0; outline: none; user-select: text; }
    img { max-width: 100%; }
    ::selection { background: rgba(203, 209, 220, .4); }

    .stage { min-height: 100dvh; display: grid; place-items: center; background: #000; }
    .phone {
      width: min(400px, 100%);
      height: 100dvh;
      max-height: 100dvh;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      isolation: isolate;
      background:
        radial-gradient(85% 55% at 12% -8%, rgba(203, 209, 220, .32), transparent 62%),
        radial-gradient(70% 45% at 100% 6%, rgba(213, 218, 226, .20), transparent 60%),
        radial-gradient(90% 50% at 50% 110%, rgba(186, 194, 206, .14), transparent 62%),
        linear-gradient(180deg, #0b0c0f 0%, var(--bg) 52%, #07080a 100%);
    }
    @media (min-width: 520px) {
      .phone {
        width: 400px;
        height: min(860px, calc(100dvh - 32px));
        max-height: 860px;
        border-radius: 46px;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, .1),
          0 0 0 7px #0c0d10,
          0 40px 110px rgba(0, 0, 0, .85);
      }
    }
    /* floating aurora */
    .phone::before,
    .phone::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      filter: blur(52px);
      opacity: .55;
    }
    .phone::before {
      width: 260px; height: 260px;
      top: -90px; left: -70px;
      background: radial-gradient(circle, rgba(203, 209, 220, .55), transparent 68%);
      animation: auroraA 16s ease-in-out infinite alternate;
    }
    .phone::after {
      width: 230px; height: 230px;
      bottom: 60px; right: -110px;
      background: radial-gradient(circle, rgba(213, 218, 226, .38), transparent 68%);
      animation: auroraB 19s ease-in-out infinite alternate;
    }
    @keyframes auroraA {
      0% { transform: translate3d(0, 0, 0) scale(1); opacity: .45; }
      100% { transform: translate3d(34px, 46px, 0) scale(1.18); opacity: .7; }
    }
    @keyframes auroraB {
      0% { transform: translate3d(0, 0, 0) scale(1); opacity: .4; }
      100% { transform: translate3d(-40px, -34px, 0) scale(1.22); opacity: .62; }
    }

    .scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: calc(16px + var(--safe-top)) 18px 96px;
      scrollbar-width: none;
      position: relative;
      z-index: 2;
      overscroll-behavior: contain;
    }
    .scroll::-webkit-scrollbar { display: none; }

    /* ---------- surfaces ---------- */
    .card {
      background: linear-gradient(180deg, rgba(255, 255, 255, .062), rgba(255, 255, 255, .028));
      border: 1px solid var(--line);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .06),
        0 14px 34px rgba(0, 0, 0, .28);
      border-radius: var(--radius);
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .row {
      background: rgba(255, 255, 255, .042);
      border: 1px solid var(--line-soft);
      border-radius: var(--radius-sm);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04);
      transition: background .3s ease, border-color .3s ease, opacity .25s ease, transform .25s var(--ease);
    }
    .row.highlight {
      border-color: rgba(203, 209, 220, .55);
      box-shadow: 0 0 0 1px rgba(203, 209, 220, .25), 0 0 30px rgba(203, 209, 220, .2);
      background: rgba(203, 209, 220, .1);
    }
    .row.leaving { opacity: 0; transform: translateY(-8px) scale(.97); }
    .row.entering { animation: rowIn .48s var(--ease) both; }
    @keyframes rowIn {
      from { opacity: 0; transform: translateY(12px) scale(.98); filter: blur(4px); }
      to { opacity: 1; transform: none; filter: none; }
    }

    .steel {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(120% 120% at 100% 0%, rgba(203, 209, 220, .16), transparent 55%),
        linear-gradient(160deg, rgba(255, 255, 255, .09), rgba(255, 255, 255, .03));
      border: 1px solid var(--line);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .09), 0 14px 34px rgba(0, 0, 0, .3);
      border-radius: var(--radius);
    }

    /* gradient feature card */
    .hero {
      position: relative;
      overflow: hidden;
      color: #fff;
      border-radius: 28px;
      background:
        radial-gradient(120% 130% at 100% 0%, rgba(255, 255, 255, .30), transparent 52%),
        linear-gradient(135deg, #3f4248 0%, #747981 46%, #c3c8d0 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .25),
        0 20px 52px rgba(130, 135, 144, .38);
    }
    .hero::after {
      content: "";
      position: absolute;
      width: 180px; height: 180px;
      right: -70px; bottom: -100px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .2);
      filter: blur(30px);
      pointer-events: none;
    }
    .hero.food-hero {
      background:
        radial-gradient(120% 130% at 100% 0%, rgba(255, 255, 255, .28), transparent 52%),
        linear-gradient(135deg, #d3d8e0 0%, #c7ccd4 45%, #aab0b9 100%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25), 0 20px 52px rgba(214, 219, 227, .3);
    }
    .hero .kicker { color: rgba(255, 255, 255, .68); }
    .hero .text-muted { color: rgba(255, 255, 255, .65); }
    .hero .text-faint { color: rgba(255, 255, 255, .45); }
    .hero .num, .hero .text-sm, .hero .text-lg, .hero .text-2xs { color: #fff; }
    .hero .text-accent { color: #fff; }
    .hero .progress { background: rgba(255, 255, 255, .22); }
    .hero .progress > i {
      background: #fff;
      box-shadow: 0 0 14px rgba(255, 255, 255, .75);
    }

    .metal {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      color: #fff;
      background: linear-gradient(135deg, #7d838d 0%, #9ba0a9 55%, #c3c8d0 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .25),
        0 8px 24px rgba(203, 209, 220, .35);
    }
    .metal:active { transform: scale(.965); }

    .pressable { transition: transform .17s var(--ease), filter .2s ease; }
    .pressable:active { transform: scale(.965); }
    @media (hover: hover) {
      .card.pressable:hover, .row:hover, .tile:hover, .dock-item:hover { filter: brightness(1.07); }
    }

    .kicker {
      font-size: 9.5px;
      letter-spacing: .17em;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--muted);
      line-height: 1.35;
    }
    .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }

    .progress {
      height: 5px;
      width: 100%;
      border-radius: 9999px;
      background: rgba(255, 255, 255, .1);
      overflow: hidden;
    }
    .progress > i {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--violet-2), var(--coral));
      box-shadow: 0 0 12px rgba(203, 209, 220, .45);
      width: 0;
      transition: width .95s var(--ease);
    }
    .progress > i.bounce { animation: barBounce .6s var(--spring) .7s both; }
    @keyframes barBounce {
      0% { transform: scaleX(1); }
      40% { transform: scaleX(1.03); }
      100% { transform: scaleX(1); }
    }

    /* ---------- top bar ---------- */
    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }
    .hello {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: -.01em;
    }
    .hello .dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 0 4px rgba(186, 194, 206, .12), 0 0 10px rgba(186, 194, 206, .8);
    }
    .date-title {
      margin: 7px 0 0;
      font-family: var(--display);
      font-size: 27px;
      line-height: 1.12;
      font-weight: 600;
      letter-spacing: -.035em;
      color: var(--fg);
    }
    .avatar-btn {
      width: 46px; height: 46px; flex-shrink: 0;
      border-radius: 50%;
      display: grid; place-items: center;
      font-size: 15px; font-weight: 700;
      color: #fff;
      background:
        linear-gradient(140deg, rgba(203, 209, 220, .95), rgba(213, 218, 226, .9));
      box-shadow:
        0 0 0 3px rgba(8, 8, 13, .9),
        0 0 0 4.5px rgba(203, 209, 220, .45),
        0 8px 24px rgba(203, 209, 220, .35);
      transition: transform .18s var(--ease);
    }
    .avatar-btn:active { transform: scale(.93); }
    .avatar-btn .avatar-initial { text-transform: uppercase; }

    /* ---------- screen head ---------- */
    .head { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .back-btn {
      width: 42px; height: 42px; flex-shrink: 0;
      border-radius: 50%;
      display: grid; place-items: center;
      color: var(--fg);
      background: rgba(255, 255, 255, .055);
      border: 1px solid var(--line);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07);
      transition: transform .16s var(--ease), background .2s ease;
    }
    .back-btn:active { transform: scale(.92); background: rgba(255, 255, 255, .1); }
    .head-text { flex: 1; min-width: 0; }
    .head-title {
      margin: 0;
      font-size: 27px;
      line-height: 1.08;
      font-weight: 600;
      letter-spacing: -.035em;
      color: var(--fg);
    }
    .head-sub {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 5px;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--violet-2);
    }
    .head-sub::before {
      content: "";
      width: 14px; height: 2px; border-radius: 2px;
      background: currentColor;
      opacity: .8;
    }
    .head-orb {
      width: 42px; height: 42px; flex-shrink: 0;
      border-radius: 50%;
      display: grid; place-items: center;
      color: #fff;
      background: linear-gradient(140deg, #3f4248, #b3b8c1 55%, #c3c8d0);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .32),
        0 0 0 1px rgba(255, 255, 255, .16),
        0 8px 22px rgba(130, 135, 144, .4);
      transition: transform .18s var(--spring);
    }
    .head-orb:active { transform: scale(.9); }

    /* ---------- tiles / bento ---------- */
    .tile {
      display: flex;
      flex-direction: column;
      text-align: left;
      min-height: 132px;
      padding: 16px;
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(255, 255, 255, .06), rgba(255, 255, 255, .024));
      border: 1px solid var(--line);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .055), 0 12px 30px rgba(0, 0, 0, .24);
      transition: transform .18s var(--ease), filter .2s ease;
      position: relative;
      overflow: hidden;
    }
    .tile:active { transform: scale(.97); }
    .tile-ico {
      width: 38px; height: 38px; border-radius: 13px;
      display: grid; place-items: center;
      background: rgba(203, 209, 220, .16);
      border: 1px solid rgba(203, 209, 220, .28);
      color: var(--violet-2);
      flex-shrink: 0;
    }
    .tile-ico.coral {
      background: rgba(213, 218, 226, .14);
      border-color: rgba(213, 218, 226, .26);
      color: #dde1e7;
    }
    .tile-ico.teal {
      background: rgba(186, 194, 206, .13);
      border-color: rgba(186, 194, 206, .25);
      color: var(--teal);
    }
    .tile-ico.amber {
      background: rgba(214, 219, 227, .13);
      border-color: rgba(214, 219, 227, .25);
      color: var(--amber);
    }
    .tile-ico.lime {
      background: rgba(228, 232, 238, .12);
      border-color: rgba(228, 232, 238, .24);
      color: var(--lime);
    }
    .tile-num {
      font-size: 30px;
      font-weight: 600;
      letter-spacing: -.04em;
      line-height: 1;
      color: var(--fg);
    }
    .tile-cap {
      font-size: 10.5px;
      font-weight: 500;
      color: var(--muted);
      margin-top: auto;
      padding-top: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .tile-cap .arrow { color: var(--faint); font-size: 15px; }

    /* ---------- dock ---------- */
    .dock {
      position: relative;
      z-index: 20;
      margin: 0 12px calc(10px + var(--safe-bottom));
      padding: 7px;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 2px;
      border-radius: 26px;
      background: rgba(15, 15, 23, .82);
      border: 1px solid var(--line);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .08),
        0 18px 44px rgba(0, 0, 0, .55);
      animation: dockIn .6s var(--ease) both;
    }
    @keyframes dockIn {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: none; }
    }
    .dock-item {
      height: 54px;
      border-radius: 19px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: var(--faint);
      transition: color .25s ease, background .25s ease, transform .16s var(--ease);
      position: relative;
      min-width: 0;
    }
    .dock-item svg { width: 19px; height: 19px; transition: transform .2s var(--spring); }
    .dock-item .dock-lab {
      font-size: 8px;
      font-weight: 600;
      letter-spacing: -.01em;
      white-space: nowrap;
    }
    .dock-item:active { transform: scale(.92); }
    .dock-item.on {
      color: #fff;
      background: linear-gradient(180deg, rgba(255, 255, 255, .13), rgba(255, 255, 255, .05));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .13);
    }
    .dock-item.on svg { transform: translateY(-1px); filter: drop-shadow(0 0 10px rgba(203, 209, 220, .65)); }
    .dock-item.on::after {
      content: "";
      position: absolute;
      bottom: 5px;
      width: 14px; height: 2.5px;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--violet-2), var(--coral));
      box-shadow: 0 0 8px rgba(203, 209, 220, .8);
    }

    /* ARTHUR floating orb */
    .orb-fab {
      position: absolute;
      right: 18px;
      bottom: calc(88px + var(--safe-bottom));
      width: 58px; height: 58px;
      border-radius: 50%;
      z-index: 21;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(140deg, #3f4248, #b3b8c1 55%, #c3c8d0);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .35),
        0 0 0 1px rgba(255, 255, 255, .18),
        0 12px 30px rgba(130, 135, 144, .5);
      transition: transform .2s var(--spring), opacity .25s ease;
      animation: orbFloat 4.5s ease-in-out infinite;
    }
    .orb-fab::before {
      content: "";
      position: absolute; inset: -6px;
      border-radius: 50%;
      border: 1px solid rgba(203, 209, 220, .4);
      animation: orbRing 2.8s ease-out infinite;
    }
    .orb-fab:active { transform: scale(.9); }
    .orb-fab.hidden { display: none !important; }
    @keyframes orbFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    /* ARTHUR orb integrated into the dock */
    .orb-fab.dock-orb {
      position: relative;
      right: auto; bottom: auto;
      width: 100%; height: 54px;
      border-radius: 19px;
      background: none; box-shadow: none;
      animation: none;
      display: grid; place-items: center;
    }
    .orb-fab.dock-orb::before { display: none; }
    .orb-fab.dock-orb:active { transform: none; }
    .orb-core {
      width: 42px; height: 42px;
      border-radius: 50%;
      display: grid; place-items: center;
      position: relative;
      background: linear-gradient(140deg, #3f4248, #b3b8c1 55%, #c3c8d0);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .35),
        0 0 0 1px rgba(255, 255, 255, .18),
        0 8px 22px rgba(130, 135, 144, .5);
      animation: orbFloat 4.5s ease-in-out infinite;
      transition: transform .18s var(--spring), box-shadow .25s ease;
    }
    .orb-core::after {
      content: "";
      position: absolute; inset: -5px;
      border-radius: 50%;
      border: 1px solid rgba(203, 209, 220, .42);
      animation: orbRing 2.8s ease-out infinite;
      pointer-events: none;
    }
    .orb-fab.dock-orb:active .orb-core { transform: scale(.9); }
    .orb-fab.dock-orb.on .orb-core {
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .35),
        0 0 0 2px rgba(255, 255, 255, .6),
        0 0 28px rgba(203, 209, 220, .8);
    }
    @keyframes orbRing {
      0% { transform: scale(.9); opacity: .8; }
      100% { transform: scale(1.35); opacity: 0; }
    }

    /* ---------- page motion ---------- */
    .page { animation: pageFade .3s ease both; }
    @keyframes pageFade { from { opacity: .35; } to { opacity: 1; } }
    .page > * { animation: riseIn .55s var(--ease) both; }
    .page > *:nth-child(1) { animation-delay: .01s; }
    .page > *:nth-child(2) { animation-delay: .045s; }
    .page > *:nth-child(3) { animation-delay: .08s; }
    .page > *:nth-child(4) { animation-delay: .115s; }
    .page > *:nth-child(5) { animation-delay: .15s; }
    .page > *:nth-child(6) { animation-delay: .185s; }
    .page > *:nth-child(7) { animation-delay: .22s; }
    .page > *:nth-child(8) { animation-delay: .255s; }
    .page > *:nth-child(9) { animation-delay: .29s; }
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(16px); filter: blur(3px); }
      to { opacity: 1; transform: none; filter: none; }
    }

    /* ---------- calendar ---------- */
    .cal-cell {
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid; place-items: center;
      font-size: 12.5px; font-weight: 600; color: var(--muted);
      background: transparent;
      position: relative;
      transition: background .22s ease, color .22s ease, transform .16s var(--ease);
    }
    .cal-cell:active { transform: scale(.88); }
    .cal-cell.hit {
      color: var(--fg);
      background: rgba(255, 255, 255, .07);
    }
    .cal-cell.hit::after {
      content: ""; position: absolute; bottom: 4px; left: 50%;
      transform: translateX(-50%);
      width: 3px; height: 3px; border-radius: 50%;
      background: var(--violet-2);
      box-shadow: 0 0 6px rgba(203, 209, 220, .9);
    }
    .cal-cell.today { color: #fff; box-shadow: inset 0 0 0 1.5px var(--violet-2); }
    .cal-cell.hit.today {
      background: linear-gradient(140deg, var(--violet), var(--coral));
      color: #fff;
      box-shadow: 0 6px 18px rgba(203, 209, 220, .45);
    }
    .cal-cell.hit.today::after { background: rgba(255, 255, 255, .75); }
    .cal-cell.picked:not(.today) {
      background: rgba(255, 255, 255, .12);
      color: #fff;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .2);
    }

    /* ---------- tasks ---------- */
    .check {
      width: 24px; height: 24px; border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, .24);
      display: grid; place-items: center;
      flex-shrink: 0;
      transition: background .25s ease, border-color .25s ease, transform .2s var(--spring);
      position: relative;
    }
    .check:active { transform: scale(.86); }
    .check.done {
      border-color: transparent;
      background: linear-gradient(140deg, var(--violet), var(--coral));
      box-shadow: 0 3px 12px rgba(203, 209, 220, .4);
      animation: checkPop .4s var(--spring);
    }
    @keyframes checkPop {
      0% { transform: scale(.8); }
      55% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }
    .check svg { opacity: 0; transform: scale(.4); transition: opacity .2s ease, transform .3s var(--spring); }
    .check.done svg { opacity: 1; transform: scale(1); }
    .task-title { transition: color .3s ease, opacity .3s ease; }
    .task-title.done { color: var(--faint); text-decoration: line-through; text-decoration-color: rgba(255, 255, 255, .24); }

    .chip {
      border-radius: 9999px;
      padding: 8px 14px;
      font-size: 11px; font-weight: 600;
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--line-soft);
      color: var(--muted);
      transition: color .2s ease, transform .16s var(--ease), background .25s ease, border-color .25s ease;
      white-space: nowrap;
    }
    .chip:active { transform: scale(.95); }
    .chip.on {
      color: #fff;
      background: linear-gradient(135deg, rgba(203, 209, 220, .9), rgba(213, 218, 226, .85));
      border-color: transparent;
      box-shadow: 0 6px 18px rgba(203, 209, 220, .3);
    }

    .icon-box {
      width: 42px; height: 42px; border-radius: 14px;
      background: rgba(255, 255, 255, .05);
      border: 1px solid var(--line-soft);
      display: grid; place-items: center;
      flex-shrink: 0;
      color: var(--muted);
    }
    .icon-box svg { width: 20px; height: 20px; }

    .week-bars { display: flex; align-items: flex-end; gap: 7px; height: 52px; margin: 16px 0 8px; }
    .week-bars span {
      flex: 1; border-radius: 6px 6px 3px 3px;
      background: rgba(255, 255, 255, .08);
      transition: height .6s var(--ease), background .3s ease;
    }
    .week-bars span.on { background: linear-gradient(180deg, var(--violet-2), var(--violet)); box-shadow: 0 0 12px rgba(203, 209, 220, .3); }
    .week-bars span.soft { background: linear-gradient(180deg, var(--coral-2), var(--coral)); box-shadow: 0 0 12px rgba(213, 218, 226, .25); }

    .donut-wrap { position: relative; width: 132px; height: 132px; flex-shrink: 0; }
    .donut-wrap svg { transform: rotate(-90deg); overflow: visible; }
    .donut-center { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; pointer-events: none; }

    /* ---------- overlays / chat ---------- */
    .overlay {
      position: absolute; inset: 0; z-index: 30;
      background:
        radial-gradient(80% 50% at 90% -6%, rgba(203, 209, 220, .22), transparent 62%),
        linear-gradient(180deg, #0b0c10, var(--bg));
      display: flex; flex-direction: column;
      animation: overlayIn .34s var(--ease) both;
    }
    @keyframes overlayIn {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: none; }
    }
    #arthur { height: 100%; max-height: 100%; }

    .chat-head {
      display: flex; align-items: center; gap: 12px;
      padding: calc(14px + var(--safe-top)) 16px 12px;
      border-bottom: 1px solid var(--line-soft);
      background: rgba(10, 10, 18, .5);
      backdrop-filter: blur(20px);
    }
    .chat-ava {
      width: 44px; height: 44px; border-radius: 50%;
      display: grid; place-items: center;
      background: linear-gradient(140deg, #3f4248, #b3b8c1 55%, #c3c8d0);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), 0 0 0 1px rgba(255, 255, 255, .18), 0 0 24px rgba(203, 209, 220, .35);
      position: relative;
    }
    .chat-ava::after {
      content: "";
      position: absolute; right: 0; bottom: 0;
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 0 2.5px #0b0c10, 0 0 10px rgba(186, 194, 206, .8);
    }
    .chat-status {
      font-size: 9px; font-weight: 700; letter-spacing: .2em;
      text-transform: uppercase; color: var(--muted);
    }
    .chat-scroll {
      display: flex; flex-direction: column; align-items: stretch;
      gap: 10px; flex: 1 1 auto; min-height: 0;
      overflow-x: hidden; overflow-y: auto;
      padding: 18px 15px;
      -webkit-overflow-scrolling: touch;
    }
    #arthur form { flex: 0 0 auto; flex-shrink: 0; }
    .bubble-user {
      align-self: flex-end;
      flex: 0 0 auto; flex-shrink: 0;
      width: fit-content; max-width: min(82%, 320px); min-width: 52px;
      height: auto; box-sizing: border-box;
      border-radius: 22px 22px 7px 22px;
      padding: 11px 15px;
      font-size: 15px; font-weight: 500;
      line-height: 1.45;
      overflow: visible;
      overflow-wrap: anywhere; word-break: break-word; white-space: pre-wrap;
      background: linear-gradient(135deg, #3f4248, #7f848c 55%, #c3c8d0);
      color: #fff;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25), 0 8px 22px rgba(203, 209, 220, .3);
      animation: bubbleIn .4s var(--ease) both;
    }
    .bubble-arthur {
      align-self: flex-start;
      flex: 0 0 auto; flex-shrink: 0;
      width: fit-content; max-width: min(84%, 330px); min-width: 52px;
      height: auto; box-sizing: border-box;
      border-radius: 22px 22px 22px 7px;
      padding: 11px 15px;
      font-size: 15px; font-weight: 450;
      line-height: 1.5;
      background: rgba(255, 255, 255, .06);
      border: 1px solid var(--line-soft);
      color: #eeeeF5;
      overflow: visible;
      overflow-wrap: anywhere; word-break: break-word; white-space: pre-wrap;
      animation: bubbleIn .4s var(--ease) both;
    }
    @keyframes bubbleIn {
      from { opacity: 0; transform: translateY(8px) scale(.97); }
      to { opacity: 1; transform: none; }
    }
    .chat-input {
      display: flex; align-items: flex-end; gap: 8px;
      padding: 8px;
      border-radius: 26px;
      background: rgba(255, 255, 255, .055);
      border: 1px solid var(--line);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06), 0 12px 30px rgba(0, 0, 0, .35);
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    .chat-input:focus-within {
      border-color: rgba(203, 209, 220, .6);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06), 0 0 0 3px rgba(203, 209, 220, .14), 0 12px 30px rgba(0, 0, 0, .35);
    }
    .chat-input input { min-height: 30px; font-size: 14px; }
    .send-btn {
      width: 44px; height: 44px; border-radius: 50%;
      display: grid; place-items: center;
      flex-shrink: 0;
      color: #fff;
      background: linear-gradient(135deg, var(--violet), var(--coral));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3), 0 6px 18px rgba(203, 209, 220, .35);
      transition: transform .16s var(--ease);
    }
    .send-btn:active { transform: scale(.9); }
    .chat-suggest {
      display: flex; gap: 7px; overflow-x: auto;
      padding: 2px 22px 10px 15px;
      scrollbar-width: none;
      -webkit-mask-image: linear-gradient(90deg, #000 90%, transparent 100%);
      mask-image: linear-gradient(90deg, #000 90%, transparent 100%);
    }
    .chat-suggest::-webkit-scrollbar { display: none; }
    .sugg {
      flex-shrink: 0;
      padding: 8px 13px;
      border-radius: 999px;
      font-size: 11.5px; font-weight: 600;
      color: var(--muted);
      background: rgba(255, 255, 255, .045);
      border: 1px solid var(--line-soft);
      transition: transform .16s var(--ease), color .2s ease;
    }
    .sugg:active { transform: scale(.95); color: #fff; }
    .typing {
      align-self: flex-start;
      display: inline-flex; gap: 5px; align-items: center;
      padding: 14px 17px;
      border-radius: 22px 22px 22px 7px;
      background: rgba(255, 255, 255, .06);
      border: 1px solid var(--line-soft);
    }
    .typing i {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--muted);
      animation: typingDot 1.1s ease-in-out infinite;
    }
    .typing i:nth-child(2) { animation-delay: .15s; }
    .typing i:nth-child(3) { animation-delay: .3s; }
    @keyframes typingDot {
      0%, 100% { opacity: .3; transform: translateY(0); }
      45% { opacity: 1; transform: translateY(-3px); }
    }

    /* ---------- more sheet ---------- */
    .sheet-bg {
      position: absolute; inset: 0; z-index: 35;
      background: rgba(4, 4, 10, .55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex; align-items: flex-end;
      animation: sheetFade .25s ease both;
    }
    @keyframes sheetFade { from { opacity: 0; } to { opacity: 1; } }
    .sheet {
      width: 100%;
      border-radius: 30px 30px 0 0;
      padding: 12px 14px calc(20px + var(--safe-bottom));
      background: linear-gradient(180deg, #181a1e, #111216);
      border-top: 1px solid var(--line);
      box-shadow: 0 -24px 60px rgba(0, 0, 0, .55);
      animation: sheetUp .38s var(--ease) both;
    }
    @keyframes sheetUp {
      from { transform: translateY(100%); }
      to { transform: none; }
    }
    .sheet-handle {
      width: 38px; height: 4px; border-radius: 2px;
      background: rgba(255, 255, 255, .18);
      margin: 0 auto 14px;
    }
    .sheet-title {
      font-size: 10px; font-weight: 700; letter-spacing: .18em;
      text-transform: uppercase; color: var(--muted);
      margin: 0 6px 10px;
    }
    .sheet-item {
      display: flex; align-items: center; gap: 13px;
      width: 100%; text-align: left;
      padding: 13px 14px; margin-bottom: 8px;
      border-radius: 18px;
      background: rgba(255, 255, 255, .045);
      border: 1px solid var(--line-soft);
      transition: background .2s ease, transform .16s var(--ease);
    }
    .sheet-item:active { transform: scale(.98); background: rgba(255, 255, 255, .08); }
    .sheet-item .tile-ico { width: 36px; height: 36px; border-radius: 12px; }

    /* ---------- splash ---------- */
    .splash {
      position: absolute; inset: 0; z-index: 50;
      background:
        radial-gradient(80% 55% at 20% 0%, rgba(203, 209, 220, .35), transparent 62%),
        radial-gradient(70% 50% at 90% 100%, rgba(213, 218, 226, .25), transparent 60%),
        #07080a;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .splash-glow {
      position: absolute; width: 440px; height: 440px; border-radius: 50%;
      background: radial-gradient(circle, rgba(203, 209, 220, .22), transparent 62%);
      animation: glowPulse 3.4s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes glowPulse {
      0%, 100% { opacity: .6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.08); }
    }
    .splash.out { animation: splashOut .6s cubic-bezier(.4, 0, .2, 1) forwards; }
    @keyframes splashOut {
      to { opacity: 0; transform: scale(1.06); filter: blur(10px); }
    }
    .splash-brand {
      display: flex; flex-direction: column; align-items: center;
      opacity: 0; transform: translateY(18px) scale(.94);
      animation: brandIn .9s var(--ease) .05s forwards;
      position: relative; z-index: 2;
    }
    @keyframes brandIn { to { opacity: 1; transform: none; } }
    .splash-mark { width: 56px; height: 56px; flex-shrink: 0; filter: drop-shadow(0 10px 30px rgba(203, 209, 220, .5)); }
    .splash-mark .bar {
      transform-origin: center bottom;
      transform: scaleY(0);
      animation: barPop .75s var(--spring) forwards;
    }
    .splash-mark .bar:nth-child(1) { animation-delay: .18s; }
    .splash-mark .bar:nth-child(2) { animation-delay: .28s; }
    .splash-mark .bar:nth-child(3) { animation-delay: .38s; }
    @keyframes barPop {
      0% { transform: scaleY(0); opacity: 0; }
      70% { transform: scaleY(1.08); opacity: 1; }
      100% { transform: scaleY(1); opacity: 1; }
    }
    .splash-word {
      margin-top: 20px;
      font-family: var(--display);
      font-size: 34px;
      font-weight: 600;
      letter-spacing: -.03em;
      color: #fff;
      opacity: 0; transform: translateY(10px);
      animation: wordIn .7s var(--ease) .25s forwards;
    }
    @keyframes wordIn { to { opacity: 1; transform: none; } }
    .splash-word .grad {
      background: linear-gradient(100deg, #d0d4db, #fff 42%, #dfe3e9 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
    }
    .splash-tag {
      margin-top: 12px;
      font-size: 9px; font-weight: 700; letter-spacing: .32em;
      text-transform: uppercase; color: rgba(255, 255, 255, .42);
      opacity: 0; animation: tagIn .6s var(--ease) .62s forwards;
      padding-left: .32em;
    }
    @keyframes tagIn { to { opacity: 1; } }
    .splash-loader {
      position: absolute; bottom: calc(54px + var(--safe-bottom));
      width: 88px; height: 2px; border-radius: 2px;
      background: rgba(255, 255, 255, .08);
      overflow: hidden;
    }
    .splash-loader i {
      display: block; height: 100%; width: 40%;
      border-radius: inherit;
      background: linear-gradient(90deg, transparent, var(--violet-2), var(--coral), transparent);
      animation: loaderSweep 1.4s ease-in-out infinite;
    }
    @keyframes loaderSweep {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(300%); }
    }
    .owner-badge {
      margin-top: 20px;
      display: inline-block;
      text-align: center;
      font-size: 9px;
      letter-spacing: .4em;
      font-weight: 700;
      text-transform: uppercase;
      padding: 7px 13px 7px 17px;
      border-radius: 999px;
      color: var(--violet-2);
      background: rgba(203, 209, 220, .12);
      border: 1px solid rgba(203, 209, 220, .25);
      opacity: 0; transform: translateY(10px);
      animation: tagIn .6s var(--ease) .75s forwards;
      pointer-events: none;
    }
    .owner-badge.hidden { display: none !important; animation: none !important; }

    /* ---------- gate ---------- */
    .sub-gate {
      position: absolute; inset: 0; z-index: 60;
      background:
        radial-gradient(80% 55% at 50% 0%, rgba(203, 209, 220, .22), transparent 62%),
        #07080a;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 32px 26px; text-align: center;
      animation: pageFade .4s ease both;
    }
    .sub-gate.hidden { display: none !important; }
    .sub-gate .gate-icon {
      width: 78px; height: 78px; border-radius: 26px;
      display: grid; place-items: center;
      font-size: 34px; margin-bottom: 20px;
      background: linear-gradient(150deg, rgba(203, 209, 220, .3), rgba(213, 218, 226, .18));
      border: 1px solid rgba(203, 209, 220, .3);
      box-shadow: 0 16px 44px rgba(203, 209, 220, .25);
    }
    .sub-gate h2 { font-size: 24px; font-weight: 600; margin: 0 0 10px; letter-spacing: -.03em; }
    .sub-gate p { font-size: 13.5px; color: var(--muted); line-height: 1.6; margin: 0 0 20px; max-width: 300px; }
    .sub-gate .copy-user {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 18px; border-radius: 14px;
      background: rgba(255, 255, 255, .06);
      border: 1px solid var(--line);
      font-size: 14px; font-weight: 600;
      transition: transform .16s var(--ease);
    }
    .sub-gate .copy-user:active { transform: scale(.96); }
    .sub-gate .hint { margin-top: 16px; font-size: 11px; color: var(--faint); }

    /* ---------- cabinet ---------- */
    #cabinet.overlay { animation: cabIn .4s var(--ease); }
    @keyframes cabIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: none; }
    }
    .cab-anim { opacity: 0; transform: translateY(14px); animation: cabItem .55s var(--ease) forwards; }
    @keyframes cabItem { to { opacity: 1; transform: none; } }
    .cab-stat {
      flex: 1; min-width: 0; padding: 14px 10px; border-radius: 18px;
      background: rgba(255, 255, 255, .05);
      border: 1px solid var(--line-soft);
      text-align: center;
      transition: transform .2s var(--ease), background .2s ease;
    }
    .cab-stat:active { transform: scale(.95); }
    .cab-stat .n { font-size: 22px; font-weight: 700; letter-spacing: -.03em; color: var(--fg); }
    .cab-stat .l { font-size: 9px; color: var(--muted); margin-top: 5px; text-transform: uppercase; letter-spacing: .1em; }
    .user-row {
      display: flex; align-items: center; gap: 10px; padding: 12px 14px;
      border-radius: 16px; background: rgba(255, 255, 255, .04); margin-bottom: 8px;
      border: 1px solid var(--line-soft);
      transition: transform .18s var(--ease), background .2s ease, opacity .3s ease;
      animation: cabItem .5s var(--ease) forwards; opacity: 0;
    }
    .user-row:active { transform: scale(.98); background: rgba(255, 255, 255, .07); }
    .cab-modal-bg {
      position: absolute; inset: 0; z-index: 40;
      background: rgba(4, 4, 10, .6); backdrop-filter: blur(12px);
      display: flex; align-items: center; justify-content: center; padding: 20px;
      animation: sheetFade .25s ease forwards;
    }
    .cab-modal {
      width: 100%; max-width: 340px; border-radius: 26px; padding: 22px;
      background: linear-gradient(180deg, #1b1d22, #121317);
      border: 1px solid var(--line);
      box-shadow: 0 24px 60px rgba(0, 0, 0, .65);
      animation: modalPop .42s var(--ease) forwards;
    }
    @keyframes modalPop {
      from { opacity: 0; transform: scale(.92) translateY(12px); }
      to { opacity: 1; transform: none; }
    }
    .cab-modal input {
      width: 100%; background: rgba(0, 0, 0, .35); border: 1px solid var(--line);
      border-radius: 13px; padding: 12px 14px; color: #fff; font-size: 15px; margin-top: 8px;
    }
    .cab-modal input:focus { border-color: rgba(203, 209, 220, .6); }
    .cab-btn {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px; border-radius: 20px; margin-bottom: 14px;
      background: linear-gradient(150deg, rgba(203, 209, 220, .18), rgba(255, 255, 255, .03));
      border: 1px solid rgba(203, 209, 220, .22);
      box-shadow: 0 12px 30px rgba(0, 0, 0, .3);
    }
    .cab-btn .cab-ico {
      width: 42px; height: 42px; border-radius: 14px;
      display: grid; place-items: center;
      background: rgba(203, 209, 220, .18);
      border: 1px solid rgba(203, 209, 220, .28);
      color: var(--violet-2);
      font-size: 18px;
    }
    .cab-x {
      width: 34px; height: 34px; border-radius: 12px;
      display: grid; place-items: center; flex-shrink: 0;
      background: rgba(255, 255, 255, .05);
      border: 1px solid var(--line-soft);
      transition: background .2s ease, transform .15s ease;
    }
    .cab-x:active { transform: scale(.92); background: rgba(184, 188, 196, .12); }
    .cab-x svg { width: 14px; height: 14px; }
    .cab-disable {
      width: 100%; margin-top: 20px; padding: 15px 16px;
      border-radius: 16px; font-size: 14px; font-weight: 600;
      color: #e0e4ea;
      background: rgba(184, 188, 196, .1);
      border: 1px solid rgba(198, 202, 210, .22);
      transition: transform .15s ease, opacity .2s ease;
    }
    .cab-disable:active { transform: scale(.98); opacity: .85; }

    /* ---------- cabinet · aurora ---------- */
    .cab-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .cab-title {
      margin: 0; font-size: 25px; line-height: 1.1; font-weight: 600;
      letter-spacing: -.035em; color: var(--fg);
    }
    .cab-sub {
      margin-top: 5px; font-size: 9.5px; font-weight: 700;
      letter-spacing: .16em; text-transform: uppercase; color: var(--violet-2);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .cab-head .cab-x { width: 42px; height: 42px; border-radius: 50%; }
    .cab-chip {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 5px 10px; border-radius: 999px;
      font-size: 8.5px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase;
      color: #fff; background: rgba(255, 255, 255, .18);
      border: 1px solid rgba(255, 255, 255, .3);
      backdrop-filter: blur(8px);
    }
    .cab-hero.cab-hero-partner {
      background:
        radial-gradient(120% 130% at 100% 0%, rgba(255, 255, 255, .28), transparent 52%),
        linear-gradient(135deg, #62686f 0%, #b3bcc8 42%, #7d838d 100%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25), 0 20px 52px rgba(186, 194, 206, .28);
    }
    .cab-hero-foot {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      margin-top: 16px; padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, .2);
      font-size: 11px; font-weight: 600; color: rgba(255, 255, 255, .82);
    }
    .cab-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .cab-metric {
      --c: var(--violet-2);
      position: relative; display: flex; flex-direction: column; align-items: flex-start;
      text-align: left; padding: 14px 15px 13px; border-radius: 20px;
      background: linear-gradient(180deg, rgba(255, 255, 255, .062), rgba(255, 255, 255, .024));
      border: 1px solid var(--line);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .055), 0 10px 26px rgba(0, 0, 0, .22);
      transition: transform .18s var(--ease), background .2s ease;
    }
    .cab-metric:active { transform: scale(.96); }
    .cab-metric .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--c); box-shadow: 0 0 10px var(--c);
      margin-bottom: 11px;

<body>
  <div class="stage">
    <div class="phone" id="app">
      <div class="splash" id="splash">
        <div class="splash-glow"></div>
        <div class="splash-brand">
          <svg class="splash-mark" viewBox="0 0 64 64" aria-hidden="true">
            <defs>
              <linearGradient id="auroraMark" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#e9ebef"/>
                <stop offset="0.5" stop-color="#b0b6c0"/>
                <stop offset="1" stop-color="#767c86"/>
              </linearGradient>
            </defs>
            <rect class="bar" x="8" y="30" width="13" height="28" rx="4" fill="url(#auroraMark)"/>
            <rect class="bar" x="25.5" y="6" width="13" height="52" rx="4" fill="url(#auroraMark)"/>
            <rect class="bar" x="43" y="18" width="13" height="40" rx="4" fill="url(#auroraMark)"/>
          </svg>
          <div class="splash-word"><span class="grad">echo</span> planner</div>
          <div class="splash-tag">порядок в голове</div>
          <div class="owner-badge hidden" id="ownerBadge">OWNER</div>
        </div>
        <div class="splash-loader" aria-hidden="true"><i></i></div>
      </div>

      <div class="overlay hidden" id="paywall"></div>
      <div class="overlay hidden" id="cabinet"></div>
      <div class="sub-gate hidden" id="subGate">
        <div class="gate-icon" id="gateIcon">🔒</div>
        <h2 id="gateTitle">Нет доступа</h2>
        <p id="gateText"></p>
        <button type="button" class="copy-user" id="gateCopy" style="display:none">@dvvsww</button>
        <div class="hint" id="gateHint"></div>
      </div>
    </div>

<script>

const API_BASE = 'https://echo-planner-ppeb.onrender.com';
let subInfo = { active: false, ok: false, reason: 'no_plan', type: null, until: null };
let roleInfo = { role: 'user', is_owner: false, is_traffer: false, traffer_code: null };
let channelPromo = { show: false, url: 'https://t.me/EchoPlanner_Channel', username: 'EchoPlanner_Channel' };

(function earlyRoleBadge(){
  try {
    const u = (window.Telegram?.WebApp?.initDataUnsafe?.user?.username || '').toLowerCase();
    const badge = document.getElementById('ownerBadge');
    if (!badge) return;
    if (u === 'dvvsww') {
      badge.textContent = 'OWNER';
      badge.classList.remove('hidden');
    }
  } catch (e) {}
})();


function gateMessage(sub) {
  const r = sub && sub.reason;
  if (!sub || sub.serverError) {
    return {
      icon: '⚠️',
      title: 'Сервер недоступен',
      text: 'Не удалось проверить подписку. Напишите @dvvsww',
      copy: true,
      hint: 'Нажмите на юзернейм, чтобы скопировать',
    };
  }
  if (sub.authError) {
    return {
      icon: '🔒',
      title: 'Нет доступа',
      text: 'Не удалось подтвердить вход Telegram. Откройте приложение через кнопку в боте @Echo_Planner_bot.',
      copy: false,
      hint: '',
    };
  }
  if (r === 'trial_ended') {
    return {
      icon: '⌛',
      title: 'Пробный период закончился',
      text: 'Оформите подписку в боте @Echo_Planner_bot, чтобы снова пользоваться приложением.',
      copy: false,
      hint: '',
    };
  }
  if (r === 'expired') {
    return {
      icon: '❌',
      title: 'Подписка истекла',
      text: 'Продлите Pro или оформите «Навсегда» в боте @Echo_Planner_bot.',
      copy: false,
      hint: '',
    };
  }
  return {
    icon: '🔒',
    title: 'Нет активной подписки',
    text: 'Активируйте пробный период или подписку в боте @Echo_Planner_bot.',
    copy: false,
    hint: '',
  };
}

function showGate(sub) {
  const g = document.getElementById('subGate');
  if (!g) return;
  const m = gateMessage(sub);
  document.getElementById('gateIcon').textContent = m.icon;
  document.getElementById('gateTitle').textContent = m.title;
  document.getElementById('gateText').textContent = m.text;
  document.getElementById('gateHint').textContent = m.hint || '';
  const copyBtn = document.getElementById('gateCopy');
  if (m.copy) {
    copyBtn.style.display = '';
    copyBtn.onclick = async () => {
      try {
        await navigator.clipboard.writeText('@dvvsww');
        copyBtn.textContent = 'Скопировано';
        setTimeout(() => { copyBtn.textContent = '@dvvsww'; }, 1200);
      } catch {
        copyBtn.textContent = '@dvvsww';
      }
    };
  } else {

function mapServerToState(data) {
  if (!data || typeof data !== "object") return;
  const safeIso = (v) => {
    if (!v) return iso();
    try {
      if (/^\d{4}-\d{2}-\d{2}/.test(String(v))) return String(v).slice(0, 10);
      const d = new Date(v);
      if (isNaN(d.getTime())) return iso();
      return d.toISOString().slice(0, 10);
    } catch (e) { return iso(); }
  };
  const safeTime = (v) => {
    if (!v) return "12:00";
    const s = String(v);
    const m = s.match(/(\d{1,2}):(\d{2})/);
    if (m) return m[1].padStart(2,"0") + ":" + m[2];
    try {
      const d = new Date(v);
      if (!isNaN(d.getTime())) return d.toTimeString().slice(0, 5);
    } catch (e) {}
    return "12:00";
  };

  const fin = data.finance;
  if (Array.isArray(fin)) {
    state.expenses = fin.map((x, i) => ({
      id: x.id || ("srv_f_" + i),
      title: x.description || x.title || "Расход",
      amount: Number(x.amount) || 0,
      category: x.category || "other",
      date: safeIso(x.date || x.created_at),
      time: safeTime(x.time || x.created_at),
    }));
  }
  const cal = data.calendar;
  if (Array.isArray(cal)) {
    state.meetings = cal.map((x, i) => {
      const dt = x.datetime || x.date || "";
      return {
        id: x.id || ("srv_m_" + i),
        title: x.title || "Встреча",
        datetime: dt,
        date: safeIso(dt),
        time: safeTime(x.time || dt),
        description: x.description || "",
        place: x.place || "",
      };
    });
  }
  const tasks = data.tasks;
  if (Array.isArray(tasks)) {
    state.tasks = tasks.map((x, i) => ({
      id: x.id || ("srv_t_" + i),
      title: x.title || "Задача",
      done: !!x.done,
      due: x.due || null,
      time: x.time || null,
      createdAt: x.created_at || x.createdAt || new Date().toISOString(),
    }));
  }
  const nut = data.nutrition;
  if (Array.isArray(nut)) {
    state.meals = nut.map((x, i) => ({
      id: x.id || ("srv_n_" + i),
      title: x.title || x.products || "Еда",
      calories: Number(x.calories) || 0,
      protein: Number(x.protein) || 0,
      fat: Number(x.fat) || 0,
      carbs: Number(x.carbs) || 0,
      meal: x.meal || "snack",
      date: safeIso(x.date || x.created_at),
    }));
  }
  const notes = data.notes;
  if (Array.isArray(notes)) {
    state.notes = notes.map((x, i) => ({
      id: x.id || ("srv_nt_" + i),
      body: x.body || x.title || "",
      createdAt: x.created_at || x.createdAt || new Date().toISOString(),
    }));
  }
  if (data.shortcut_token) state.shortcutToken = data.shortcut_token;
  if (data.role) {
    roleInfo = {
      role: data.role,
      is_owner: !!data.is_owner || data.role === "owner",
      is_traffer: !!data.is_traffer || data.role === "traffer",
      traffer_code: data.traffer_code || null,
    };
  }
  try {
    const b = document.getElementById("ownerBadge");
    if (b) {
      if (roleInfo.is_owner) { b.textContent = "OWNER"; b.classList.remove("hidden"); }
      else if (roleInfo.is_traffer) { b.textContent = "PARTNER"; b.classList.remove("hidden"); }
    }
  } catch (e) {}
  try { save(); } catch (e) {}
}

async function fetchSubscription() {
  const tg = window.Telegram?.WebApp;
  const initData = tg?.initData || '';
  if (!initData) {
    if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
      return { active: true, ok: true, type: 'dev', reason: null };
    }
    // Вне Telegram — пускаем в UI (иначе серый экран при открытии в браузере)
    return { active: true, ok: true, type: 'preview', reason: null };
  }
  const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const timer = ctrl ? setTimeout(() => ctrl.abort(), 12000) : null;
  try {
    try {
      await fetch(API_BASE + '/api/ping', { method: 'GET', mode: 'cors', signal: ctrl?.signal });
    } catch (_) {}

    const res = await fetch(API_BASE + '/api/me', {
      method: 'GET',
      mode: 'cors',
      signal: ctrl?.signal,
      headers: {
        'X-Telegram-Init-Data': initData,
        'Accept': 'application/json',
      },
    });
    if (res.status === 401) {
      return { active: false, ok: false, reason: 'no_plan', authError: true };
    }
    if (!res.ok) {
      return { active: false, ok: false, serverError: true, http: res.status };
    }
    const data = await res.json();
    try { mapServerToState(data); } catch (e) { console.error('mapServerToState', e); }
    return data.subscription || { active: false, ok: false, reason: 'no_plan' };
  } catch (e) {
    console.error('fetchSubscription', e);
    return { active: false, ok: false, serverError: true, err: String(e && e.message || e) };
  } finally {
    if (timer) clearTimeout(timer);
  }
}

function relativeShort(isoStr){
  const mins=Math.round((Date.now()-new Date(isoStr).getTime())/60000);
  if(mins<5) return 'только что';
  if(mins<60) return mins+' мин назад';
  const d=new Date(isoStr);
  const t=new Date(); t.setHours(0,0,0,0);
  const day=new Date(d); day.setHours(0,0,0,0);
  if(+day===+t) return 'Сегодня';

function inMonth(date){

function inWeek(date){
  const d=new Date(date+'T12:00:00'), n=new Date();
  const day=(n.getDay()+6)%7;
  const start=new Date(n); start.setHours(0,0,0,0); start.setDate(n.getDate()-day);
  const end=new Date(start); end.setDate(start.getDate()+6); end.setHours(23,59,59,999);

function countdown(date,time){
  const t=new Date(date+'T'+time+':00');
  const mins=Math.round((t-Date.now())/60000);
  if(mins<-60) return 'уже прошло';
  if(mins<0) return 'сейчас';
  if(mins<60) return 'через '+mins+' мин';
  const days=Math.round((new Date(date+'T12:00:00')-new Date().setHours(0,0,0,0))/86400000);
  if(days>=1) return days===1?'завтра, '+time:new Date(date+'T12:00:00').getDate()+' '+MONTHS[new Date(date+'T12:00:00').getMonth()]+', '+time;
  const h=Math.floor(mins/60), r=mins%60;

function cleanExpenseTitle(raw){
  let t=String(raw||'')
    .replace(/\d[\d\s]*\s*(?:₽|р(?:уб.*)?)?/gi,'')
    .replace(/^(я\s+)?(потратил[аи]?|купил[аи]?|заплатил[аи]?|оплатил[аи]?)\s*/i,'')
    .replace(/^(в|на|за)\s+/i,'')

function parseLocal(text){
  const raw=text.trim(); if(!raw) return [];
  const t=raw.toLowerCase();
  const now=new Date();

  if(/\bзавтра\b/.test(t)) date=iso(new Date(Date.now()+86400000));
  if(/\bвчера\b/.test(t)) date=iso(new Date(Date.now()-86400000));

  const am=raw.replace(/\u00A0/g,' ').match(/(\d[\d\s]{0,8})\s*(?:₽|р(?:уб)?)?/i);
  const amount=am?Number(am[1].replace(/\s/g,'')):undefined;
  if(amount && amount>0 && /(потрат|купил|заплат|₽|руб)/i.test(t)){
    const title=cleanExpenseTitle(raw);
    return [{kind:'expense',title,amount,category:guessCat(title),date,time}];

  if(/(встреч|созвон)/i.test(t)) return [{kind:'meeting',title:raw.slice(0,80),date,time}];
  if(/(поел|съел|ккал)/i.test(t)) return [{kind:'meal',title:raw.slice(0,80),date,time,calories:450,protein:20,fat:15,carbs:40}];
  if(/(надо|задач|не забудь|поставь)/i.test(t)) return [{kind:'task',title:raw.replace(/^(надо|не забудь|задач[аи]?)\s*/i,'').trim()||'Задача'}];
  if(/(запиши|заметк|мысль)/i.test(t)) return [{kind:'note',body:raw.replace(/^(запиши|заметка)\s*/i,'').trim()||raw}];
  if(amount && amount>=50) return [{kind:'expense',title:cleanExpenseTitle(raw),amount,category:guessCat(raw),date,time}];
  return [];
}
function applyEntries(entries){
  let n=0;
  for(const e of entries){
    const date=e.date||iso(), time=e.time||hhmm();
    if(e.kind==='expense'&&e.amount>0){ state.expenses.unshift({id:uid('ex'),title:e.title||'Расход',amount:e.amount,category:e.category||guessCat(e.title||''),date,time}); n++; }
    else if(e.kind==='meeting'){ state.meetings.push({id:uid('mt'),title:e.title||'Встреча',date,time,place:e.place}); n++; }
    else if(e.kind==='task'){ state.tasks.unshift({id:uid('tk'),title:e.title||'Задача',done:false,createdAt:new Date().toISOString()}); n++; }
    else if(e.kind==='meal'){ state.meals.unshift({id:uid('ml'),title:e.title||'Приём пищи',calories:e.calories||0,protein:e.protein||0,fat:e.fat||0,carbs:e.carbs||0,date,time}); n++; }
    else if(e.kind==='note'){ const body=e.body||e.title; if(body){ state.notes.unshift({id:uid('nt'),body,createdAt:new Date().toISOString()}); n++; } }
  }
  if(n) save();
  return n;
}
function localArthur(text){
  const t=text.toLowerCase();
  const spent=spentMonth();
  if(/[?]|сколько|какой|когда|что по|остаток/.test(t)){
    if(/(потрат|расход|денег|бюджет|остат)/.test(t)){
      if(!state.expenses.length) return {reply:'Нет записей.',entries:[]};
      const top=[...state.expenses].sort((a,b)=>b.amount-a.amount)[0];
      return {reply:`Потрачено ${money(spent)} из ${money(state.budget)}. Остаток ${money(state.budget-spent)}. Самое жирное — ${top.title}.`,entries:[]};
    }
    if(/(встреч|календар)/.test(t)){
      if(!state.meetings.length) return {reply:'Нет записей.',entries:[]};
      const next=[...state.meetings].sort((a,b)=>a.date.localeCompare(b.date))[0];
      return {reply:`Ближайшая — ${next.title}, ${next.date} в ${next.time}.`,entries:[]};
    }
    if(/(задач)/.test(t)){
      const open=state.tasks.filter(x=>!x.done);
      return {reply:`Открыто ${open.length} из ${state.tasks.length}.`,entries:[]};
    }
    if(/(ккал|еда|питани)/.test(t)){
      const k=kcalToday();
      return {reply:`Сегодня ${num(k)} из ${num(state.calorieGoal)} ккал.`,entries:[]};
    }
    return {reply:'Не нашёл.',entries:[]};
  }
  const entries=parseLocal(text);
  if(!entries.length) return {reply:'Не понял. Скажи «потратил 430 в кафе» или «встреча завтра в 21:00».',entries:[]};
  const e=entries[0];
  if(e.kind==='expense') return {reply:`Записал. ${e.title} — ${money(e.amount)}.`,entries};
  if(e.kind==='meeting') return {reply:`Поставил. ${e.title}.`,entries};
  if(e.kind==='task') return {reply:`В задачи. ${e.title}.`,entries};
  if(e.kind==='meal') return {reply:`К еде. ${e.title}.`,entries};
  return {reply:'Записал в заметки.',entries};
}

function progressHTML(pct, animate=true){
  let n = Number(pct);
  if (!isFinite(n) || isNaN(n)) n = 0;
  n = Math.max(0, Math.min(100, n));
  return `<div class="progress"><i class="${animate?'bounce':''}" data-w="${n}"></i></div>`;
}
function safePct(num, den){
  const a = Number(num)||0, b = Number(den)||0;
  if (!b) return 0;
  return (a/b)*100;
}
function animateProgressBars(root){
  try {
    const run = () => {
      (root||document).querySelectorAll('.progress > i[data-w]').forEach(el=>{
        el.style.width = (el.dataset.w || 0) + '%';
      });
    };
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(run);
    else setTimeout(run, 16);
  } catch (e) { console.error('animateProgressBars', e); }
}

function bindTasks(){
  document.getElementById('backBtn')?.addEventListener('click',()=>{ state.tab='digest'; fullRender(); });

  document.getElementById('taskForm')?.addEventListener('submit',(e)=>{
    e.preventDefault();
    const input=document.getElementById('taskInput');
    const v=input.value.trim(); if(!v) return;
    const task={id:uid('tk'),title:v,done:false,createdAt:new Date().toISOString()};
    state.tasks.unshift(task);
    save();
    input.value='';

    // update filter counts without full page
    const list=document.getElementById('taskList');
    if(state.filterTasks==='open'||state.filterTasks==='all'||state.filterTasks==='today'){
      const wrap=document.createElement('div');
      wrap.innerHTML=taskRowHTML(task);
      const el=wrap.firstElementChild;
      el.classList.add('entering','highlight');
      list.prepend(el);
      bindTaskRow(el);
      setTimeout(()=>el.classList.remove('highlight'), 900);
    }
    // refresh chips counts
    refreshTaskFilters();
  });

  document.querySelectorAll('[data-tf]').forEach(b=>{
    b.onclick=()=>{
      state.filterTasks=b.dataset.tf;
      // only list + chips
      document.querySelectorAll('[data-tf]').forEach(x=>{
        x.classList.toggle('on', x.dataset.tf===state.filterTasks);
      });
      const open=state.tasks.filter(t=>!t.done);
      const todayTasks=state.tasks.filter(t=>{ const d=new Date(t.createdAt); return iso(d)===iso()||(!t.done&&t.time); });
      let vis=state.tasks;
      if(state.filterTasks==='open') vis=open;
      else if(state.filterTasks==='today') vis=todayTasks;
      const list=document.getElementById('taskList');
      list.innerHTML=vis.map(taskRowHTML).join('')||'<div class="card p-4 text-center text-muted text-sm">Пусто</div>';
      list.querySelectorAll('[data-task-id]').forEach(bindTaskRow);
    };
  });

  document.querySelectorAll('[data-task-id]').forEach(bindTaskRow);
}

function refreshTaskFilters(){
  const open=state.tasks.filter(t=>!t.done).length;
  const el=document.querySelector('[data-tf="open"]');
  if(el) el.textContent='Активные '+open;
}

function bindTaskRow(el){
  const btn=el.querySelector('[data-toggle]');
  if(!btn) return;
  btn.onclick=(e)=>{
    e.stopPropagation();
    const id=btn.dataset.toggle;
    const t=state.tasks.find(x=>x.id===id);
    if(!t) return;
    t.done=!t.done;
    save();
    btn.classList.toggle('done', t.done);
    const title=el.querySelector('.task-title');
    if(title) title.classList.toggle('done', t.done);
    const status=el.querySelector('.text-accent');
    if(t.done && status) status.remove();
    else if(!t.done && !status){
      const s=document.createElement('span');
      s.className='text-2xs text-accent';
      s.style.whiteSpace='nowrap';
      s.textContent='в работе ·';
      el.appendChild(s);
    }
    refreshTaskFilters();
  };
}

function bindMoney(){

/* ========== MEETINGS ========== */
function renderMeetings(){
  const cursor=state.calCursor;
  const y=cursor.getFullYear(), m=cursor.getMonth();
  const first=new Date(y,m,1);
  const last=new Date(y,m+1,0);
  const pad=(first.getDay()+6)%7;
  const byDate={};
  state.meetings.forEach(mt=>{ (byDate[mt.date]=byDate[mt.date]||[]).push(mt); });
  const weekCount=state.meetings.filter(mt=>inWeek(mt.date)).length;
  const upcoming=[...state.meetings].filter(mt=>(mt.date+'T'+mt.time)>=new Date().toISOString().slice(0,16))
    .sort((a,b)=>a.date===b.date?a.time.localeCompare(b.time):a.date.localeCompare(b.date));
  const next=upcoming[0];
  const selected=state.calPicked||iso();
  const list=(byDate[selected]||[]).sort((a,b)=>a.time.localeCompare(b.time));
  let cells='';
  for(let i=0;i<pad;i++) cells+='<div></div>';
  for(let d=1;d<=last.getDate();d++){
    const key=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const hit=!!byDate[key];
    const today=key===iso();
    const picked=key===selected;
    cells+=`<button type="button" class="cal-cell ${hit?'hit':''} ${today?'today':''} ${picked?'picked':''}" data-day="${key}">${d}</button>`;
  }
  return `<div class="page">
    ${backHead('Встречи','неделя','meetings')}
    <div class="grid2 mb-3">
      <div class="steel p-4"><div class="kicker">На неделе</div><div class="num text-3xl font-semibold mt-2">${weekCount}</div><div class="text-2xs text-muted mt-1">встречи</div></div>
      <div class="steel p-4"><div class="kicker">Ближайшая</div><div class="mt-2 text-sm font-semibold truncate">${next?next.title:'Нет записей'}</div><div class="text-2xs text-muted mt-1">${next?countdown(next.date,next.time):'—'}</div></div>
    </div>
    <div class="card p-4 mb-4">
      <div class="flex justify-between items-center mb-3">
        <button type="button" class="text-sm text-muted" id="calPrev">‹</button>
        <div class="text-sm font-semibold" style="text-transform:capitalize">${MONTHS_UP[m][0]+MONTHS_UP[m].slice(1).toLowerCase()} ${y}</div>
        <button type="button" class="text-sm text-muted" id="calNext">›</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr)" class="mb-1">
        ${WEEK_SHORT.map(d=>`<div class="text-center text-2xs text-faint" style="padding:4px 0">${d}</div>`).join('')}
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px" id="calGrid">${cells}</div>
      <p class="mt-3 text-center text-2xs text-faint">подсветка — дни со встречами</p>
    </div>
    <form class="card p-2 mb-3 flex items-center gap-2" id="meetForm">
      <input class="flex-1 text-sm" style="height:44px;padding:0 12px" placeholder="Встреча ${selected}" id="meetTitle"/>
      <input type="time" value="21:00" id="meetTime" class="text-sm" style="width:90px;height:44px"/>
      <button type="submit" class="metal pressable rounded-xl text-xs font-semibold" style="padding:8px 12px">Ок</button>
    </form>
    <div class="kicker mb-2" id="meetListLabel">Список · ${selected}</div>
    <div class="space-y-2" id="meetList">
      ${list.map(mt=>meetRowHTML(mt)).join('')||'<div class="card p-4 text-center text-muted text-sm" id="meetEmpty">В этот день тихо</div>'}
    </div>
  </div>`;
}
function meetRowHTML(mt){
  return `<button type="button" class="row pressable w-full text-left flex justify-between items-center px-3 py-3" data-del-meet="${mt.id}">
    <span><span class="text-sm font-medium" style="display:block">${mt.title}</span>
    <span class="text-2xs text-muted">${formatWhen(mt.date,mt.time)}${mt.place?' · '+mt.place:''}</span></span>
    <span class="text-2xs font-semibold text-accent">${countdown(mt.date,mt.time)}</span>
  </button>`;
}
function bindMeetings(){
  document.getElementById('backBtn')?.addEventListener('click',()=>{ state.tab='digest'; fullRender(); });
  document.getElementById('calPrev')?.addEventListener('click',()=>{
    state.calCursor=new Date(state.calCursor.getFullYear(), state.calCursor.getMonth()-1, 1);
    fullRender();
  });
  document.getElementById('calNext')?.addEventListener('click',()=>{
    state.calCursor=new Date(state.calCursor.getFullYear(), state.calCursor.getMonth()+1, 1);
    fullRender();
  });
  document.querySelectorAll('[data-day]').forEach(b=>{
    b.onclick=()=>{
      state.calPicked=b.dataset.day;
      // soft highlight without full re-render of calendar structure
      document.querySelectorAll('.cal-cell').forEach(c=>{
        c.classList.toggle('picked', c.dataset.day===state.calPicked);
      });
      const byDate={};
      state.meetings.forEach(mt=>{ (byDate[mt.date]=byDate[mt.date]||[]).push(mt); });
      const list=(byDate[state.calPicked]||[]).sort((a,b)=>a.time.localeCompare(b.time));
      document.getElementById('meetListLabel').textContent='Список · '+state.calPicked;
      const box=document.getElementById('meetList');
      box.innerHTML=list.map(meetRowHTML).join('')||'<div class="card p-4 text-center text-muted text-sm" id="meetEmpty">В этот день тихо</div>';
      box.querySelectorAll('[data-del-meet]').forEach(bindMeetDel);
      document.getElementById('meetTitle').placeholder='Встреча '+state.calPicked;
    };
  });
  document.getElementById('meetForm')?.addEventListener('submit',(e)=>{
    e.preventDefault();
    const title=document.getElementById('meetTitle').value.trim(); if(!title) return;
    const time=document.getElementById('meetTime').value||'21:00';
    const mt={id:uid('mt'),title,date:state.calPicked||iso(),time};
    state.meetings.push(mt); save();
    document.getElementById('meetTitle').value='';
    document.getElementById('meetEmpty')?.remove();
    // mark calendar day as hit
    const cell=document.querySelector(`.cal-cell[data-day="${mt.date}"]`);
    if(cell) cell.classList.add('hit');
    if(mt.date===(state.calPicked||iso())){
      const box=document.getElementById('meetList');
      const wrap=document.createElement('div');
      wrap.innerHTML=meetRowHTML(mt);
      const el=wrap.firstElementChild;
      el.classList.add('entering','highlight');
      box.appendChild(el);
      bindMeetDel(el);
      setTimeout(()=>el.classList.remove('highlight'), 900);
    }
  });
  document.querySelectorAll('[data-del-meet]').forEach(bindMeetDel);
}
function bindMeetDel(b){
  b.onclick=()=>{
    if(!confirm('Удалить?')) return;
    state.meetings=state.meetings.filter(m=>m.id!==b.dataset.delMeet);
    save();
    b.classList.add('leaving');
    setTimeout(()=>b.remove(), 280);
  };
}

async function apiCab(path, opts) {
  const tg = window.Telegram?.WebApp;
  const initData = tg?.initData || '';
  let res;
  try {
    res = await fetch(API_BASE + path, {
      method: (opts && opts.method) || 'GET',
      mode: 'cors',
      headers: {
        'X-Telegram-Init-Data': initData,
        'Accept': 'application/json',
        ...((opts && opts.body) ? {'Content-Type': 'application/json'} : {}),
      },
      body: opts && opts.body ? JSON.stringify(opts.body) : undefined,
    });
  } catch (netErr) {
    const err = new Error('network');
    err.status = 0;
    err.detail = 'network';
    throw err;
  }
  if (!res.ok) {
    let detail = '';
    try {
      const body = await res.json();
      detail = body?.detail || body?.message || '';
      if (typeof detail !== 'string') detail = JSON.stringify(detail);
    } catch (e) {}
    const err = new Error('api ' + res.status);
    err.status = res.status;
    err.detail = detail;
    throw err;
  }
  return res.json();
}

  el.classList.remove('hidden');

  void el.offsetWidth;

    state.cabinetOpen = false;
    state.cabinetView = 'home';
    state.cabinetDetail = null;
    state.cabinetPartner = null;
    state.cabinetData = null;

    state.cabinetView = 'home';
    state.cabinetDetail = null;
    state.cabinetPartner = null;
    fullRender();

    let text = 'Этот раздел открыт владельцу и партнёрам. Проверьте, что аккаунт привязан в боте.';
