<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#000000" />
  <title>ECHO Planner</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050505;
      --card: #121212;
      --fg: #f4f4f4;
      --muted: #8a8a8a;
      --faint: #5c5c5c;
      --accent: #ff6a1a;
      --ink: #141414;
      --metal: #cfcfcf;
      --radius: 22px;
      --radius-tile: 16px;
      --font: "Manrope", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #000; color: var(--fg);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }
    button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
    input, textarea { font-family: inherit; color: var(--fg); background: transparent; border: 0; outline: none; }
    .stage { min-height: 100dvh; display: grid; place-items: center; background: #000; }
    .phone {
      width: min(390px, 100%); height: 100dvh; max-height: 100dvh;
      background: var(--bg); position: relative; overflow: hidden;
      display: flex; flex-direction: column;
    }
    @media (min-width: 520px) {
      .phone {
        width: 390px; height: min(844px, calc(100dvh - 32px)); max-height: 844px;
        border-radius: 44px;
        box-shadow: 0 0 0 2px #2a2a2c, 0 0 0 6px #0a0a0a, 0 30px 80px rgba(0,0,0,.65);
      }
    }
    .scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 10px; scrollbar-width: none; }
    .scroll::-webkit-scrollbar { display: none; }

    .card {
      background: linear-gradient(180deg, #1a1a1a 0%, #101010 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 0 0 1px rgba(255,255,255,.045);
      border-radius: var(--radius); position: relative;
    }
    .row {
      background: linear-gradient(180deg, #161616 0%, #101010 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 0 0 1px rgba(255,255,255,.04);
      border-radius: 18px;
      transition: background .35s ease, box-shadow .45s ease, opacity .3s ease, transform .3s ease;
    }
    .row.highlight {
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.35),
        0 0 0 1px rgba(220,220,220,.35),
        0 0 24px rgba(200,200,200,.18);
      background: linear-gradient(180deg, #2a2a2c 0%, #1a1a1c 100%);
    }
    .row.leaving {
      opacity: 0; transform: translateY(-6px) scale(.98);
    }
    .row.entering {
      animation: rowIn .45s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes rowIn {
      from { opacity: 0; transform: translateY(10px); filter: blur(4px); }
      to { opacity: 1; transform: none; filter: none; }
    }
    .steel {
      position: relative; isolation: isolate; overflow: hidden;
      background:
        linear-gradient(180deg, rgba(255,255,255,.1), transparent 42%),
        linear-gradient(100deg, #2e2e30 0%, #161618 18%, #3a3a3c 40%, #121214 62%, #2a2a2c 82%, #1a1a1c 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.2), inset 0 -1px 0 rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.06);
      border-radius: var(--radius);
    }
    .steel::before {
      content: ""; position: absolute; inset: 0; border-radius: inherit;
      background: repeating-linear-gradient(90deg, rgba(255,255,255,.045) 0 1px, transparent 1px 3px);
      opacity: .7; pointer-events: none; mix-blend-mode: overlay;
    }
    .metal {
      position: relative; isolation: isolate; overflow: hidden; color: var(--ink);
      background:
        repeating-linear-gradient(90deg, rgba(255,255,255,.16) 0 1px, transparent 1px 3px),
        linear-gradient(165deg, #f7f7f7 0%, #b4b4b4 16%, #ececec 34%, #8a8a8a 50%, #d8d8d8 68%, #9a9a9a 84%, #efefef 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.72), inset 0 -1px 0 rgba(0,0,0,.38), 0 2px 10px rgba(0,0,0,.45);
    }
    .pressable { transition: transform 150ms ease-out; }
    .pressable:active { transform: scale(0.96); }

    .kicker {
      font-size: 10px; letter-spacing: .14em; font-weight: 600;
      text-transform: uppercase; color: var(--muted);
    }
    .num { font-variant-numeric: tabular-nums; }

    .progress {
      height: 3px; width: 100%; border-radius: 9999px;
      background: rgba(255,255,255,.08); overflow: hidden;
    }
    .progress > i {
      display: block; height: 100%; border-radius: inherit;
      background: var(--accent);
      width: 0;
      transition: width .9s cubic-bezier(.22,1,.36,1);
    }
    .progress > i.bounce {
      animation: barBounce .55s cubic-bezier(.34,1.4,.64,1) .75s both;
    }
    @keyframes barBounce {
      0% { transform: scaleX(1); }
      40% { transform: scaleX(1.035); }
      100% { transform: scaleX(1); }
    }

    /* ===== DOCK — panel.png: 2×4, logo bottom-right ===== */
    .dock {
      padding: 8px 12px calc(12px + env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: 54px 54px;
      gap: 8px;
      background: linear-gradient(180deg, transparent, var(--bg) 20%);
    }
    .dock-cell {
      border-radius: 14px;
      background: linear-gradient(180deg, #1c1c1c 0%, #0e0e0e 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 0 0 1px rgba(255,255,255,.04);
      color: var(--muted);
      display: flex; flex-direction: column;
      align-items: flex-start; justify-content: center;
      padding: 8px 10px;
      transition: transform 150ms ease-out, filter .2s ease;
      min-width: 0;
    }
    .dock-cell:active { transform: scale(0.96); }
    .dock-cell.on {
      color: var(--ink);
      background:
        repeating-linear-gradient(90deg, rgba(255,255,255,.14) 0 1px, transparent 1px 3px),
        linear-gradient(165deg, #f6f6f6 0%, #b8b8b8 18%, #e8e8e8 36%, #8d8d8d 52%, #d4d4d4 70%, #9a9a9a 86%, #ececec 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.7), inset 0 -1px 0 rgba(0,0,0,.35), 0 2px 8px rgba(0,0,0,.45);
    }
    .dock-cell.on .dock-num,
    .dock-cell.on .dock-lab {
      color: #1a1a1a;
      text-shadow: 0 1px 0 rgba(255,255,255,.28);
    }
    .dock-num { font-size: 10px; letter-spacing: .06em; font-weight: 600; opacity: .75; line-height: 1; }
    .dock-lab { font-size: 11px; font-weight: 700; letter-spacing: .03em; line-height: 1.15; margin-top: 3px; }

    .dock-logo {
      border-radius: 14px;
      background: linear-gradient(180deg, #1c1c1c 0%, #0e0e0e 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 0 0 1px rgba(255,255,255,.04);
      display: grid; place-items: center;
      transition: transform 150ms ease-out;
    }
    .dock-logo:active { transform: scale(0.96); }
    .dock-logo.on {
      background:
        repeating-linear-gradient(90deg, rgba(255,255,255,.14) 0 1px, transparent 1px 3px),
        linear-gradient(165deg, #f6f6f6 0%, #b8b8b8 40%, #ececec 100%);
    }

    .page { animation: pageIn 380ms cubic-bezier(.22,1,.36,1) both; }
    @keyframes pageIn {
      from { opacity: 0; transform: translateY(12px); filter: blur(3px); }
      to { opacity: 1; transform: none; filter: none; }
    }

    .cal-cell {
      aspect-ratio: 1; border-radius: 10px; display: grid; place-items: center;
      font-size: 12px; font-weight: 600; color: var(--muted); background: transparent;
      transition: background .2s ease, color .2s ease, box-shadow .2s ease;
    }
    .cal-cell.hit {
      background: linear-gradient(180deg, #2a2a2c, #161616); color: var(--fg);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 0 0 1px rgba(255,255,255,.08);
    }
    .cal-cell.today {
      box-shadow: 0 0 0 1.5px var(--accent); color: var(--fg);
    }
    .cal-cell.hit.today { background: var(--accent); color: #fff; box-shadow: none; }
    .cal-cell.picked:not(.today) {
      background: rgba(255,255,255,.08);
      color: var(--fg);
      box-shadow: 0 0 0 1px rgba(255,255,255,.18);
    }

    .check {
      width: 22px; height: 22px; border-radius: 50%;
      box-shadow: 0 0 0 1.5px rgba(255,255,255,.22);
      display: grid; place-items: center;
      flex-shrink: 0;
      transition: background .25s ease, box-shadow .25s ease, transform .25s ease;
      position: relative;
    }
    .check.done {
      background:
        repeating-linear-gradient(90deg, rgba(255,255,255,.14) 0 1px, transparent 1px 3px),
        linear-gradient(165deg, #f4f4f4, #9a9a9a 55%, #e0e0e0);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 1px 4px rgba(0,0,0,.35);
    }
    .check svg {
      opacity: 0; transform: scale(.4);
      transition: opacity .2s ease, transform .28s cubic-bezier(.34,1.4,.64,1);
    }
    .check.done svg {
      opacity: 1; transform: scale(1);
    }
    .task-title {
      transition: color .3s ease, opacity .3s ease;
    }
    .task-title.done {
      color: var(--faint);
      text-decoration: line-through;
      text-decoration-color: rgba(255,255,255,.25);
    }

    .chip {
      border-radius: 9999px; padding: 6px 12px; font-size: 11px; font-weight: 600;
      background: linear-gradient(180deg, #1c1c1c, #101010);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 0 0 1px rgba(255,255,255,.05);
      color: var(--muted);
      transition: color .2s ease;
    }
    .chip.on { color: var(--ink); }

    .icon-box {
      width: 42px; height: 42px; border-radius: 12px;
      background: #0c0c0c;
      box-shadow: 0 0 0 1px rgba(255,255,255,.07);
      display: grid; place-items: center;
      flex-shrink: 0;
    }
    .icon-box svg { width: 20px; height: 20px; }

    .week-bars {
      display: flex; align-items: flex-end; gap: 6px; height: 48px; margin: 14px 0 6px;
    }
    .week-bars span {
      flex: 1; border-radius: 4px 4px 2px 2px;
      background: rgba(255,255,255,.12);
      transition: height .5s cubic-bezier(.22,1,.36,1), background .3s ease;
    }
    .week-bars span.on { background: var(--accent); }
    .week-bars span.soft { background: rgba(255,106,26,.35); }

    .donut-wrap { position: relative; width: 88px; height: 88px; flex-shrink: 0; }
    .donut-wrap svg { transform: rotate(-90deg); }
    .donut-center {
      position: absolute; inset: 0; display: grid; place-items: center;
      text-align: center; pointer-events: none;
    }

    .overlay {
      position: absolute; inset: 0; z-index: 30; background: var(--bg);
      display: flex; flex-direction: column;
    }
    .bubble-user {
      align-self: flex-end; max-width: 80%; border-radius: 16px 16px 4px 16px;
      padding: 10px 14px; font-size: 14px; line-height: 1.45;
    }
    .bubble-arthur {
      align-self: flex-start; max-width: 80%; border-radius: 16px 16px 16px 4px;
      padding: 10px 14px; font-size: 14px; line-height: 1.45;
    }
    .splash {
      position: absolute; inset: 0; z-index: 50; background: #000;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .splash.out {
      animation: splashOut .55s cubic-bezier(.4,0,.2,1) forwards;
    }
    @keyframes splashOut {
      to { opacity: 0; transform: scale(1.06); filter: blur(8px); pointer-events: none; }
    }
    .splash-brand {
      display: flex; align-items: center; gap: 18px;
      opacity: 0;
      transform: translateY(28px) scale(.88);
      filter: blur(10px);
      animation: brandIn 1.05s cubic-bezier(.16,1,.3,1) .15s forwards;
    }
    @keyframes brandIn {
      to { opacity: 1; transform: none; filter: none; }
    }
    .splash-mark {
      width: 56px; height: 56px;
      flex-shrink: 0;
      filter: drop-shadow(0 8px 24px rgba(255,255,255,.12));
    }
    .splash-mark .bar {
      transform-origin: center bottom;
      transform: scaleY(0);
      animation: barPop .7s cubic-bezier(.34,1.45,.64,1) forwards;
    }
    .splash-mark .bar:nth-child(1) { animation-delay: .25s; }
    .splash-mark .bar:nth-child(2) { animation-delay: .38s; }
    .splash-mark .bar:nth-child(3) { animation-delay: .5s; }
    @keyframes barPop {
      0% { transform: scaleY(0); opacity: 0; }
      70% { transform: scaleY(1.08); opacity: 1; }
      100% { transform: scaleY(1); opacity: 1; }
    }
    .splash-word {
      display: flex; flex-direction: column; line-height: .95;
      opacity: 0;
      transform: translateX(18px);
      animation: wordIn .85s cubic-bezier(.16,1,.3,1) .55s forwards;
    }
    @keyframes wordIn {
      to { opacity: 1; transform: none; }
    }
    .splash-word .line1,
    .splash-word .line2 {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.03em;
      background: linear-gradient(175deg, #ffffff 0%, #c8c8c8 28%, #f0f0f0 48%, #8a8a8a 62%, #d8d8d8 82%, #a0a0a0 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 8px rgba(255,255,255,.08));
    }
    .splash-word .line2 {
      font-weight: 400;
      opacity: .92;
    }
    .splash-shine {
      position: absolute; inset: -20%;
      background: radial-gradient(ellipse 50% 40% at 50% 50%, rgba(255,255,255,.07), transparent 60%);
      pointer-events: none;
      animation: shinePulse 2s ease-in-out infinite;
    }
    @keyframes shinePulse {
      0%, 100% { opacity: .5; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }

    .sub-gate {
      position: absolute; inset: 0; z-index: 60; background: #050505;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 28px 24px; text-align: center;
    }
    .sub-gate.hidden { display: none !important; }
    .sub-gate .gate-icon { font-size: 42px; margin-bottom: 16px; }
    .sub-gate h2 { font-size: 20px; font-weight: 600; margin: 0 0 10px; letter-spacing: -0.02em; }
    .sub-gate p { font-size: 14px; color: var(--muted); line-height: 1.5; margin: 0 0 18px; max-width: 300px; }
    .sub-gate .copy-user {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 14px; border-radius: 12px;
      background: linear-gradient(180deg, #1c1c1c, #101010);
      box-shadow: 0 0 0 1px rgba(255,255,255,.08);
      font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .sub-gate .copy-user:active { transform: scale(0.97); }
    .sub-gate .hint { margin-top: 14px; font-size: 11px; color: var(--faint); }

    .hidden { display: none !important; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .flex { display: flex; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .gap-2 { gap: 8px; }
    .gap-3 { gap: 12px; }
    .mb-2 { margin-bottom: 8px; }
    .mb-3 { margin-bottom: 12px; }
    .mb-4 { margin-bottom: 16px; }
    .mb-5 { margin-bottom: 20px; }
    .mt-1 { margin-top: 4px; }
    .mt-2 { margin-top: 8px; }
    .mt-3 { margin-top: 12px; }
    .mt-auto { margin-top: auto; }
    .w-full { width: 100%; }
    .text-left { text-align: left; }
    .text-center { text-align: center; }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .min-h-card { min-height: 120px; }
    .p-4 { padding: 16px; }
    .p-5 { padding: 20px; }
    .px-3 { padding-left: 12px; padding-right: 12px; }
    .py-3 { padding-top: 12px; padding-bottom: 12px; }
    .text-sm { font-size: 14px; }
    .text-xs { font-size: 12px; }
    .text-2xs { font-size: 11px; }
    .text-lg { font-size: 18px; }
    .text-2xl { font-size: 24px; }
    .text-3xl { font-size: 30px; }
    .text-4xl { font-size: 34px; }
    .font-medium { font-weight: 500; }
    .font-semibold { font-weight: 600; }
    .font-bold { font-weight: 700; }
    .tracking-tight { letter-spacing: -0.02em; }
    .text-muted { color: var(--muted); }
    .text-faint { color: var(--faint); }
    .text-accent { color: var(--accent); }
    .flex-1 { flex: 1; min-width: 0; }
    .space-y-2 > * + * { margin-top: 8px; }
    .space-y-3 > * + * { margin-top: 12px; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="phone" id="app">
      <div class="splash" id="splash">
        <div class="splash-shine"></div>
        <div class="splash-brand">
          <svg class="splash-mark" viewBox="0 0 64 64" aria-hidden="true">
            <defs>
              <linearGradient id="splashMetal" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#f7f7f7"/>
                <stop offset="0.22" stop-color="#a8a8a8"/>
                <stop offset="0.45" stop-color="#efefef"/>
                <stop offset="0.7" stop-color="#6e6e6e"/>
                <stop offset="1" stop-color="#d4d4d4"/>
              </linearGradient>
              <linearGradient id="splashMetal2" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#ffffff"/>
                <stop offset="0.35" stop-color="#9a9a9a"/>
                <stop offset="0.55" stop-color="#ececec"/>
                <stop offset="1" stop-color="#7a7a7a"/>
              </linearGradient>
              <filter id="splashGrain">
                <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="noise"/>
                <feBlend in="SourceGraphic" in2="noise" mode="overlay"/>
              </filter>
            </defs>
            <rect class="bar" x="6" y="32" width="14" height="26" rx="3.5" fill="url(#splashMetal)"/>
            <rect class="bar" x="25" y="6" width="14" height="52" rx="3.5" fill="url(#splashMetal2)"/>
            <rect class="bar" x="44" y="18" width="14" height="40" rx="3.5" fill="url(#splashMetal)"/>
          </svg>
          <div class="splash-word">
            <span class="line1">Echo</span>
            <span class="line2">Planner</span>
          </div>
        </div>
      </div>
      <main class="scroll" id="main"></main>
      <nav class="dock" id="dock" aria-label="Разделы"></nav>
      <div class="overlay hidden" id="arthur"></div>
      <div class="overlay hidden" id="paywall"></div>
      <div class="sub-gate hidden" id="subGate">
        <div class="gate-icon" id="gateIcon">🔒</div>
        <h2 id="gateTitle">Нет доступа</h2>
        <p id="gateText"></p>
        <button type="button" class="copy-user" id="gateCopy" style="display:none">@dvvsww</button>
        <div class="hint" id="gateHint"></div>
      </div>
    </div>
  </div>

<script>

const API_BASE = 'https://echo-planner-ppeb.onrender.com';
let subInfo = { active: false, ok: false, reason: 'no_plan', type: null, until: null };

function gateMessage(sub) {
  const r = sub && sub.reason;
  if (!sub || sub.serverError) {
    return {
      icon: '⚠️',
      title: 'Сервер недоступен',
      text: 'Не удалось проверить подписку. Напишите @dvvsww',
      copy: true,
      hint: 'Нажмите на юзернейм, чтобы скопировать',
    };
  }
  if (r === 'trial_ended') {
    return {
      icon: '⌛',
      title: 'Пробный период закончился',
      text: 'Оформите подписку в боте @Echo_Planner_bot, чтобы снова пользоваться приложением.',
      copy: false,
      hint: '',
    };
  }
  if (r === 'expired') {
    return {
      icon: '❌',
      title: 'Подписка истекла',
      text: 'Продлите Pro или оформите «Навсегда» в боте @Echo_Planner_bot.',
      copy: false,
      hint: '',
    };
  }
  return {
    icon: '🔒',
    title: 'Нет активной подписки',
    text: 'Активируйте пробный период или подписку в боте @Echo_Planner_bot.',
    copy: false,
    hint: '',
  };
}

function showGate(sub) {
  const g = document.getElementById('subGate');
  if (!g) return;
  const m = gateMessage(sub);
  document.getElementById('gateIcon').textContent = m.icon;
  document.getElementById('gateTitle').textContent = m.title;
  document.getElementById('gateText').textContent = m.text;
  document.getElementById('gateHint').textContent = m.hint || '';
  const copyBtn = document.getElementById('gateCopy');
  if (m.copy) {
    copyBtn.style.display = '';
    copyBtn.onclick = async () => {
      try {
        await navigator.clipboard.writeText('@dvvsww');
        copyBtn.textContent = 'Скопировано';
        setTimeout(() => { copyBtn.textContent = '@dvvsww'; }, 1200);
      } catch {
        copyBtn.textContent = '@dvvsww';
      }
    };
  } else {
    copyBtn.style.display = 'none';
  }
  g.classList.remove('hidden');
  document.getElementById('dock')?.classList.add('hidden');
  document.getElementById('main')?.classList.add('hidden');
}

function hideGate() {
  document.getElementById('subGate')?.classList.add('hidden');
  document.getElementById('dock')?.classList.remove('hidden');

async function fetchSubscription() {
  const tg = window.Telegram?.WebApp;
  const initData = tg?.initData || '';
  // Вне Telegram (браузер) — только для разработки; на проде WebApp обязан
  if (!initData) {
    // dev escape: local preview
    if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
      return { active: true, ok: true, type: 'dev', reason: null };
    }
    return { active: false, ok: false, reason: 'no_plan', serverError: false };
  }
  try {
    const res = await fetch(API_BASE + '/api/me', {
      headers: { 'X-Telegram-Init-Data': initData },
    });
    if (!res.ok) {
      if (res.status >= 500) return { active: false, ok: false, serverError: true };
      return { active: false, ok: false, reason: 'no_plan' };
    }
    const data = await res.json();
    return data.subscription || { active: false, ok: false, reason: 'no_plan' };
  } catch (e) {
    return { active: false, ok: false, serverError: true };
  }
}

function uid(p='id'){ return p+'_'+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4); }
function iso(d=new Date()){ return d.toISOString().slice(0,10); }
function hhmm(d=new Date()){ return d.toTimeString().slice(0,5); }
function money(n){ return Math.abs(Math.round(n)).toLocaleString('ru-RU').replace(/\u00A0/g,' ')+' ₽'; }
function num(n){ return Math.round(n).toLocaleString('ru-RU').replace(/\u00A0/g,' '); }
function dayTitle(d=new Date()){ return d.getDate()+' '+MONTHS[d.getMonth()]; }
function formatWhen(date,time){
  const d=new Date(date+'T12:00:00');
  const t=new Date(); t.setHours(0,0,0,0);
  const diff=Math.round((d-t)/86400000);
  if(diff===0) return 'Сегодня, '+time;
  if(diff===-1) return 'Вчера, '+time;
  return d.getDate()+' '+MONTHS[d.getMonth()]+', '+time;
}
function relativeShort(isoStr){
  const mins=Math.round((Date.now()-new Date(isoStr).getTime())/60000);
  if(mins<5) return 'только что';
  if(mins<60) return mins+' мин назад';
  const d=new Date(isoStr);
  const t=new Date(); t.setHours(0,0,0,0);
  const day=new Date(d); day.setHours(0,0,0,0);
  if(+day===+t) return 'Сегодня';
  if(+day===t-86400000) return 'Вчера';
  return d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3);
}
function inMonth(date){
  const d=new Date(date+'T12:00:00'), n=new Date();
  return d.getMonth()===n.getMonth() && d.getFullYear()===n.getFullYear();
}
function inWeek(date){
  const d=new Date(date+'T12:00:00'), n=new Date();
  const day=(n.getDay()+6)%7;
  const start=new Date(n); start.setHours(0,0,0,0); start.setDate(n.getDate()-day);
  const end=new Date(start); end.setDate(start.getDate()+6); end.setHours(23,59,59,999);
  return d>=start && d<=end;
}
function countdown(date,time){
  const t=new Date(date+'T'+time+':00');
  const mins=Math.round((t-Date.now())/60000);
  if(mins<-60) return 'уже прошло';
  if(mins<0) return 'сейчас';
  if(mins<60) return 'через '+mins+' мин';
  const days=Math.round((new Date(date+'T12:00:00')-new Date().setHours(0,0,0,0))/86400000);
  if(days>=1) return days===1?'завтра, '+time:new Date(date+'T12:00:00').getDate()+' '+MONTHS[new Date(date+'T12:00:00').getMonth()]+', '+time;
  const h=Math.floor(mins/60), r=mins%60;
  return r===0?'через '+h+' ч':'через '+h+' ч '+r+' мин';
}
function guessCat(title){
  const t=title.toLowerCase();
  if(/кафе|кофе|ресторан|бар/.test(t)) return 'cafe';
  if(/продукт|магазин|перекрёсток|пятерочк|вкусвилл/.test(t)) return 'groceries';
  if(/такси|яндекс|uber|ситимобил/.test(t)) return 'taxi';
  if(/подписк|spotify|apple|youtube|иви|okko/.test(t)) return 'sub';
  if(/шоп|одежд|zara|nike|ozon|wildberries|wb/.test(t)) return 'shop';
  if(/аренда|квартир|ипотек/.test(t)) return 'rent';
  if(/аптек|врач|клиник|стомат/.test(t)) return 'health';
  return 'other';
}

function parseLocal(text){
  const raw=text.trim(); if(!raw) return [];
  const t=raw.toLowerCase();
  const now=new Date();
  let date=iso(now);
  if(/\bзавтра\b/.test(t)) date=iso(new Date(Date.now()+86400000));
  if(/\bвчера\b/.test(t)) date=iso(new Date(Date.now()-86400000));
  const tm=t.match(/\b(?:в\s*)?(\d{1,2})[:.](\d{2})\b/);
  const time=tm?String(tm[1]).padStart(2,'0')+':'+tm[2]:hhmm(now);
  const am=raw.replace(/\u00A0/g,' ').match(/(\d[\d\s]{0,8})\s*(?:₽|р(?:уб)?)?/i);
  const amount=am?Number(am[1].replace(/\s/g,'')):undefined;
  if(amount && amount>0 && /(потрат|купил|заплат|₽|руб)/i.test(t)){
    const title=raw.replace(/\d[\d\s]*\s*(?:₽|р(?:уб.*)?)?/gi,'').replace(/^(я\s+)?(потратил[аи]?|купил[аи]?)\s*/i,'').trim()||'Расход';
    return [{kind:'expense',title,amount,category:guessCat(title),date,time}];
  }
  if(/(встреч|созвон)/i.test(t)) return [{kind:'meeting',title:raw.slice(0,80),date,time}];
  if(/(поел|съел|ккал)/i.test(t)) return [{kind:'meal',title:raw.slice(0,80),date,time,calories:450,protein:20,fat:15,carbs:40}];
  if(/(надо|задач|не забудь|поставь)/i.test(t)) return [{kind:'task',title:raw.replace(/^(надо|не забудь|задач[аи]?)\s*/i,'').trim()||'Задача'}];
  if(/(запиши|заметк|мысль)/i.test(t)) return [{kind:'note',body:raw.replace(/^(запиши|заметка)\s*/i,'').trim()||raw}];
  if(amount && amount>=50) return [{kind:'expense',title:raw.replace(/\d[\d\s]*\s*(?:₽|р(?:уб.*)?)?/gi,'').trim()||'Расход',amount,category:guessCat(raw),date,time}];
  return [];
}
function applyEntries(entries){
  let n=0;
  for(const e of entries){
    const date=e.date||iso(), time=e.time||hhmm();
    if(e.kind==='expense'&&e.amount>0){ state.expenses.unshift({id:uid('ex'),title:e.title||'Расход',amount:e.amount,category:e.category||guessCat(e.title||''),date,time}); n++; }
    else if(e.kind==='meeting'){ state.meetings.push({id:uid('mt'),title:e.title||'Встреча',date,time,place:e.place}); n++; }
    else if(e.kind==='task'){ state.tasks.unshift({id:uid('tk'),title:e.title||'Задача',done:false,createdAt:new Date().toISOString()}); n++; }
    else if(e.kind==='meal'){ state.meals.unshift({id:uid('ml'),title:e.title||'Приём пищи',calories:e.calories||0,protein:e.protein||0,fat:e.fat||0,carbs:e.carbs||0,date,time}); n++; }
    else if(e.kind==='note'){ const body=e.body||e.title; if(body){ state.notes.unshift({id:uid('nt'),body,createdAt:new Date().toISOString()}); n++; } }
  }
  if(n) save();
  return n;
}
function localArthur(text){
  const t=text.toLowerCase();
  const spent=spentMonth();
  if(/[?]|сколько|какой|когда|что по|остаток/.test(t)){
    if(/(потрат|расход|денег|бюджет|остат)/.test(t)){
      if(!state.expenses.length) return {reply:'Нет записей.',entries:[]};
      const top=[...state.expenses].sort((a,b)=>b.amount-a.amount)[0];
      return {reply:`Потрачено ${money(spent)} из ${money(state.budget)}. Остаток ${money(state.budget-spent)}. Самое жирное — ${top.title}.`,entries:[]};
    }
    if(/(встреч|календар)/.test(t)){
      if(!state.meetings.length) return {reply:'Нет записей.',entries:[]};
      const next=[...state.meetings].sort((a,b)=>a.date.localeCompare(b.date))[0];
      return {reply:`Ближайшая — ${next.title}, ${next.date} в ${next.time}.`,entries:[]};
    }
    if(/(задач)/.test(t)){
      const open=state.tasks.filter(x=>!x.done);
      return {reply:`Открыто ${open.length} из ${state.tasks.length}.`,entries:[]};
    }
    if(/(ккал|еда|питани)/.test(t)){
      const k=kcalToday();
      return {reply:`Сегодня ${num(k)} из ${num(state.calorieGoal)} ккал.`,entries:[]};
    }
    return {reply:'Не нашёл.',entries:[]};
  }
  const entries=parseLocal(text);
  if(!entries.length) return {reply:'Не понял. Скажи «потратил 430 в кафе» или «встреча завтра в 21:00».',entries:[]};
  const e=entries[0];
  if(e.kind==='expense') return {reply:`Записал. ${e.title} — ${money(e.amount)}.`,entries};
  if(e.kind==='meeting') return {reply:`Поставил. ${e.title}.`,entries};
  if(e.kind==='task') return {reply:`В задачи. ${e.title}.`,entries};
  if(e.kind==='meal') return {reply:`К еде. ${e.title}.`,entries};
  return {reply:'Записал в заметки.',entries};
}

/* ========== TASKS (tasks.png) ========== */
function weekTaskBars(){
  // synthetic weekly completion heights matching reference vibe
  const done=state.tasks.filter(t=>t.done).length;
  const total=Math.max(1,state.tasks.length);
  const base=[0.35,0.5,0.65,0.8,0.95,0.4,0.25];
  const todayIdx=(new Date().getDay()+6)%7;
  return base.map((h,i)=>{
    const on=i<=todayIdx && i<5;
    const soft=i===todayIdx;
    return {h: Math.round(h*100), on, soft};
  });
}
function taskRowHTML(t){
  const status = t.done ? '' : '<span class="text-2xs text-accent" style="white-space:nowrap">в работе ·</span>';
  const when = t.time || relativeShort(t.createdAt);
  return `<div class="row flex items-center gap-3 px-3 py-3" data-task-id="${t.id}">
    <button type="button" class="check ${t.done?'done':''}" data-toggle="${t.id}" aria-label="Готово">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5L19 7" stroke="#111" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="flex-1">
      <div class="task-title text-sm font-medium ${t.done?'done':''}">${t.title}</div>
      <div class="text-2xs text-faint mt-1">${when==='только что'||when==='Сегодня'?when:when}</div>
    </div>
    ${status}
  </div>`;
}
function renderTasks(){
  const open=state.tasks.filter(t=>!t.done);
  const done=state.tasks.filter(t=>t.done);
  const todayTasks=state.tasks.filter(t=>{
    const d=new Date(t.createdAt); return iso(d)===iso() || (!t.done && t.time);

  const bars=weekTaskBars();

  return `<div class="page">
    ${backHead('TASKS','сегодня')}

      <div class="kicker">Прогресс</div>
      <div class="flex justify-between items-end mt-2">

          <div class="num text-3xl font-semibold">${done.length} <span class="text-muted text-lg font-medium">/ ${state.tasks.length}</span></div>

        </div>
        <div class="text-right">

          <div class="text-2xs text-muted">готово</div>
        </div>
      </div>
      <div class="week-bars">
        ${bars.map(b=>`<span class="${b.on?'on':''} ${b.soft?'soft':''}" style="height:${b.h}%"></span>`).join('')}
      </div>
      <div class="flex justify-between text-2xs text-faint" style="margin-top:2px">
        ${labels.map((l,i)=>`<span class="${i===6?'text-accent':''}" style="flex:1;text-align:center;text-transform:lowercase">${l.toLowerCase()}</span>`).join('')}
      </div>
      <div class="flex justify-between mt-3 pt-3" style="border-top:1px solid rgba(255,255,255,.06)">
        <div class="text-2xs text-muted">закрыто 2 дня в подряд</div>
        <div class="flex gap-3">
          <div class="text-center"><div class="num text-sm font-semibold text-accent">${open.length}</div><div class="text-2xs text-muted">в работе</div></div>
          <div class="text-center"><div class="num text-sm font-semibold">0</div><div class="text-2xs text-muted">просрочено</div></div>
        </div>
      </div>

    <form class="card p-2 mb-3 flex items-center gap-2" id="taskForm">
      <input class="flex-1 text-sm" style="height:44px;padding:0 12px" placeholder="Новая задача" id="taskInput"/>

    </form>

    <div class="flex gap-2 mb-3" id="taskFilters">
      ${[
        ['open','Активные '+open.length],
        ['today','Сегодня'],
        ['all','Все'],
      ].map(([id,lab])=>`
        <button type="button" class="chip ${state.filterTasks===id?'on metal':''}" data-tf="${id}">${lab}</button>
      `).join('')}

    <div class="space-y-2" id="taskList">

}

function bindTasks(){
  document.getElementById('backBtn')?.addEventListener('click',()=>{ state.tab='digest'; fullRender(); });

  document.getElementById('taskForm')?.addEventListener('submit',(e)=>{
    e.preventDefault();
    const input=document.getElementById('taskInput');
    const v=input.value.trim(); if(!v) return;
    const task={id:uid('tk'),title:v,done:false,createdAt:new Date().toISOString()};
    state.tasks.unshift(task);
    save();
    input.value='';

    // update filter counts without full page
    const list=document.getElementById('taskList');
    if(state.filterTasks==='open'||state.filterTasks==='all'||state.filterTasks==='today'){
      const wrap=document.createElement('div');
      wrap.innerHTML=taskRowHTML(task);
      const el=wrap.firstElementChild;
      el.classList.add('entering','highlight');
      list.prepend(el);
      bindTaskRow(el);
      setTimeout(()=>el.classList.remove('highlight'), 900);
    }
    // refresh chips counts
    refreshTaskFilters();
  });

  document.querySelectorAll('[data-tf]').forEach(b=>{
    b.onclick=()=>{
      state.filterTasks=b.dataset.tf;
      // only list + chips
      document.querySelectorAll('[data-tf]').forEach(x=>{
        x.classList.toggle('on', x.dataset.tf===state.filterTasks);
        x.classList.toggle('metal', x.dataset.tf===state.filterTasks);
      });
      const open=state.tasks.filter(t=>!t.done);
      const todayTasks=state.tasks.filter(t=>{ const d=new Date(t.createdAt); return iso(d)===iso()||(!t.done&&t.time); });
      let vis=state.tasks;
      if(state.filterTasks==='open') vis=open;
      else if(state.filterTasks==='today') vis=todayTasks;
      const list=document.getElementById('taskList');
      list.innerHTML=vis.map(taskRowHTML).join('')||'<div class="card p-4 text-center text-muted text-sm">Пусто</div>';
      list.querySelectorAll('[data-task-id]').forEach(bindTaskRow);
    };
  });

  document.querySelectorAll('[data-task-id]').forEach(bindTaskRow);
}

function refreshTaskFilters(){
  const open=state.tasks.filter(t=>!t.done).length;
  const el=document.querySelector('[data-tf="open"]');
  if(el) el.textContent='Активные '+open;
}

function bindTaskRow(el){
  const btn=el.querySelector('[data-toggle]');
  if(!btn) return;
  btn.onclick=(e)=>{
    e.stopPropagation();
    const id=btn.dataset.toggle;
    const t=state.tasks.find(x=>x.id===id);
    if(!t) return;
    t.done=!t.done;
    save();
    btn.classList.toggle('done', t.done);
    const title=el.querySelector('.task-title');
    if(title) title.classList.toggle('done', t.done);
    const status=el.querySelector('.text-accent');
    if(t.done && status) status.remove();
    else if(!t.done && !status){
      const s=document.createElement('span');
      s.className='text-2xs text-accent';
      s.style.whiteSpace='nowrap';
      s.textContent='в работе ·';
      el.appendChild(s);
    }
    refreshTaskFilters();
  };
}

/* ========== MEETINGS ========== */
function renderMeetings(){
  const cursor=state.calCursor;
  const y=cursor.getFullYear(), m=cursor.getMonth();
  const first=new Date(y,m,1);
  const last=new Date(y,m+1,0);
  const pad=(first.getDay()+6)%7;
  const byDate={};
  state.meetings.forEach(mt=>{ (byDate[mt.date]=byDate[mt.date]||[]).push(mt); });
  const weekCount=state.meetings.filter(mt=>inWeek(mt.date)).length;
  const upcoming=[...state.meetings].filter(mt=>(mt.date+'T'+mt.time)>=new Date().toISOString().slice(0,16))
    .sort((a,b)=>a.date===b.date?a.time.localeCompare(b.time):a.date.localeCompare(b.date));
  const next=upcoming[0];
  const selected=state.calPicked||iso();
  const list=(byDate[selected]||[]).sort((a,b)=>a.time.localeCompare(b.time));
  let cells='';
  for(let i=0;i<pad;i++) cells+='<div></div>';
  for(let d=1;d<=last.getDate();d++){
    const key=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const hit=!!byDate[key];
    const today=key===iso();
    const picked=key===selected;
    cells+=`<button type="button" class="cal-cell ${hit?'hit':''} ${today?'today':''} ${picked?'picked':''}" data-day="${key}">${d}</button>`;
  }
  return `<div class="page">
    ${backHead('MEETINGS','НЕДЕЛЯ')}
    <div class="grid2 mb-3">
      <div class="steel p-4"><div class="kicker">На неделе</div><div class="num text-3xl font-semibold mt-2">${weekCount}</div><div class="text-2xs text-muted mt-1">встречи</div></div>
      <div class="steel p-4"><div class="kicker">Ближайшая</div><div class="mt-2 text-sm font-semibold truncate">${next?next.title:'Нет записей'}</div><div class="text-2xs text-muted mt-1">${next?countdown(next.date,next.time):'—'}</div></div>
    </div>
    <div class="card p-4 mb-4">
      <div class="flex justify-between items-center mb-3">
        <button type="button" class="text-sm text-muted" id="calPrev">‹</button>
        <div class="text-sm font-semibold" style="text-transform:capitalize">${MONTHS[m]} ${y}</div>
        <button type="button" class="text-sm text-muted" id="calNext">›</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr)" class="mb-1">
        ${WEEK_SHORT.map(d=>`<div class="text-center text-2xs text-faint" style="padding:4px 0">${d}</div>`).join('')}
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px" id="calGrid">${cells}</div>
      <p class="mt-3 text-center text-2xs text-faint">подсветка — дни со встречами</p>
    </div>
    <form class="card p-2 mb-3 flex items-center gap-2" id="meetForm">
      <input class="flex-1 text-sm" style="height:44px;padding:0 12px" placeholder="Встреча ${selected}" id="meetTitle"/>
      <input type="time" value="21:00" id="meetTime" class="text-sm" style="width:90px;height:44px"/>
      <button type="submit" class="metal pressable rounded-xl text-xs font-semibold" style="padding:8px 12px">Ок</button>
    </form>
    <div class="kicker mb-2" id="meetListLabel">Список · ${selected}</div>
    <div class="space-y-2" id="meetList">
      ${list.map(mt=>meetRowHTML(mt)).join('')||'<div class="card p-4 text-center text-muted text-sm" id="meetEmpty">В этот день тихо</div>'}
    </div>
  </div>`;
}
function meetRowHTML(mt){
  return `<button type="button" class="row pressable w-full text-left flex justify-between items-center px-3 py-3" data-del-meet="${mt.id}">
    <span><span class="text-sm font-medium" style="display:block">${mt.title}</span>

function bindMeetings(){

    const cell=document.querySelector(`.cal-cell[data-day="${mt.date}"]`);

    if(mt.date===(state.calPicked||iso())){

      wrap.innerHTML=meetRowHTML(mt);
      const el=wrap.firstElementChild;
      el.classList.add('entering','highlight');
      box.appendChild(el);
      bindMeetDel(el);
      setTimeout(()=>el.classList.remove('highlight'), 900);
    }
  });
  document.querySelectorAll('[data-del-meet]').forEach(bindMeetDel);
}
function bindMeetDel(b){
  b.onclick=()=>{
    if(!confirm('Удалить?')) return;
    state.meetings=state.meetings.filter(m=>m.id!==b.dataset.delMeet);
    save();
    b.classList.add('leaving');
    setTimeout(()=>b.remove(), 280);
  };
}

/* ========== FOOD (food.png) ========== */
function renderFood(){
  const today=state.meals.filter(m=>m.date===iso()).sort((a,b)=>a.time.localeCompare(b.time));
  const kcal=today.reduce((a,m)=>a+m.calories,0);
  const p=today.reduce((a,m)=>a+m.protein,0);
  const f=today.reduce((a,m)=>a+m.fat,0);
  const c=today.reduce((a,m)=>a+m.carbs,0);
  const left=Math.max(0,state.calorieGoal-kcal);
  const macroKcal = p*4 + f*9 + c*4;
  const pPct = macroKcal?Math.round(p*4/macroKcal*100):0;
  const fPct = macroKcal?Math.round(f*9/macroKcal*100):0;
  const cPct = Math.max(0,100-pPct-fPct);
  // donut segments
  const R=36, CIRC=2*Math.PI*R;
  const pLen=CIRC*pPct/100, fLen=CIRC*fPct/100, cLen=CIRC*cPct/100;

  return `<div class="page">
    ${backHead('FOOD','сегодня')}
    <div class="steel p-5 mb-3">
      <div class="kicker">Калории</div>
      <div class="mt-2 flex justify-between items-end">
        <div class="num text-4xl font-semibold tracking-tight">${num(kcal)} <span class="text-muted text-lg font-medium">/ ${num(state.calorieGoal)}</span></div>
        <div class="text-sm font-semibold text-accent">${num(left)} left</div>
      </div>
      <div class="mt-4">${progressHTML(kcal/state.calorieGoal*100)}</div>
    </div>

    <div class="grid2 mb-4" style="grid-template-columns:1fr 1fr 1fr">
      <div class="card p-4 text-center"><div class="num text-2xl font-semibold">${Math.round(p)}</div><div class="text-2xs text-muted mt-1">белки</div></div>
      <div class="card p-4 text-center"><div class="num text-2xl font-semibold">${Math.round(f)}</div><div class="text-2xs text-muted mt-1">жиры</div></div>
      <div class="card p-4 text-center"><div class="num text-2xl font-semibold">${Math.round(c)}</div><div class="text-2xs text-muted mt-1">углеводы</div></div>
    </div>

    <div class="kicker mb-2">Приёмы пищи</div>
    <div class="space-y-2 mb-4">
      ${today.map(m=>`
        <button type="button" class="row pressable w-full text-left flex justify-between items-center px-3 py-3" data-del-meal="${m.id}">
          <span>
            <span class="text-sm font-medium" style="display:block">${m.title}</span>
            <span class="text-2xs text-muted">${formatWhen(m.date,m.time)}</span>
          </span>
          <span class="text-right flex items-center gap-2">
            <span>
              <span class="num text-sm font-semibold" style="display:block">${m.calories} ккал</span>
              <span class="text-2xs text-faint">Б ${m.protein} · Ж ${m.fat} · У ${m.carbs}</span>
            </span>
            <span class="text-faint">›</span>
          </span>
        </button>`).join('')||'<div class="card p-4 text-center text-muted text-sm">Сегодня ещё не ел</div>'}
    </div>

    <div class="card p-4 mb-3">
      <div class="kicker mb-3">Баланс макронутриентов</div>
      <div class="flex items-center gap-3">
        <div class="donut-wrap">
          <svg width="88" height="88" viewBox="0 0 88 88">
            <circle cx="44" cy="44" r="${R}" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="10"/>
            <circle cx="44" cy="44" r="${R}" fill="none" stroke="#ff6a1a" stroke-width="10"
              stroke-dasharray="${pLen} ${CIRC-pLen}" stroke-dashoffset="0" stroke-linecap="butt"/>
            <circle cx="44" cy="44" r="${R}" fill="none" stroke="#3b82f6" stroke-width="10"
              stroke-dasharray="${fLen} ${CIRC-fLen}" stroke-dashoffset="${-pLen}" stroke-linecap="butt"/>
            <circle cx="44" cy="44" r="${R}" fill="none" stroke="#a855f7" stroke-width="10"
              stroke-dasharray="${cLen} ${CIRC-cLen}" stroke-dashoffset="${-(pLen+fLen)}" stroke-linecap="butt"/>
          </svg>
          <div class="donut-center">
            <div>
              <div class="num text-lg font-semibold">${Math.round(macroKcal||kcal)}</div>
              <div class="text-2xs text-muted">ккал</div>
            </div>
          </div>
        </div>
        <div class="flex-1 space-y-2">
          <div class="flex justify-between items-center text-sm">
            <span class="flex items-center gap-2"><span style="width:8px;height:8px;border-radius:50%;background:#ff6a1a"></span> Белки</span>
            <span class="num">${Math.round(p)} г <span class="text-muted">${pPct}%</span></span>
          </div>
          <div class="flex justify-between items-center text-sm">
            <span class="flex items-center gap-2"><span style="width:8px;height:8px;border-radius:50%;background:#3b82f6"></span> Жиры</span>
            <span class="num">${Math.round(f)} г <span class="text-muted">${fPct}%</span></span>
          </div>
          <div class="flex justify-between items-center text-sm">
            <span class="flex items-center gap-2"><span style="width:8px;height:8px;border-radius:50%;background:#a855f7"></span> Углеводы</span>
            <span class="num">${Math.round(c)} г <span class="text-muted">${cPct}%</span></span>
          </div>
          <div class="text-2xs text-faint mt-2">Рекомендуемое соотношение<br/>30% · 20% · 50%</div>
        </div>
      </div>
    </div>
  </div>`;
}
function bindFood(){
  document.getElementById('backBtn')?.addEventListener('click',()=>{ state.tab='digest'; fullRender(); });
  document.querySelectorAll('[data-del-meal]').forEach(b=>{
    b.onclick=()=>{ if(!confirm('Удалить?')) return; state.meals=state.meals.filter(m=>m.id!==b.dataset.delMeal); save(); fullRender(); };
  });
}

/* ========== SETTINGS ========== */
function renderSettings(){
  return `<div class="page">
    ${backHead('SETTINGS','ECHO')}
    <div class="steel p-4 mb-4 flex items-center gap-3">
      <div style="width:44px;height:44px;display:grid;place-items:center;border-radius:12px;background:var(--bg)">${markSVG(28)}</div>
      <div>
        <div class="text-lg font-semibold">${state.displayName}</div>
        <div class="text-2xs text-muted">${state.plan==='forever'?'Тариф «Навсегда»':state.plan==='pro'?'Тариф Pro':'Нет тарифа'}</div>
      </div>
    </div>
    <label class="card p-4 mb-3" style="display:block">
      <div class="kicker">Имя</div>
      <input class="mt-2 text-lg font-medium w-full" value="${state.displayName}" id="nameInput"/>
    </label>
    <label class="card p-4 mb-3" style="display:block">
      <div class="kicker">Бюджет месяца, ₽</div>
      <input type="number" class="mt-2 text-lg font-medium w-full num" value="${state.budget}" id="budgetInput"/>
    </label>
    <label class="card p-4 mb-4" style="display:block">
      <div class="kicker">Цель по калориям</div>
      <input type="number" class="mt-2 text-lg font-medium w-full num" value="${state.calorieGoal}" id="calInput"/>
    </label>
    <div class="card p-4 mb-3">
      <div class="kicker">Подписка</div>
      <div class="mt-2 text-sm font-semibold" id="subStatusLine">${subInfo.ok ? (subInfo.type === 'lifetime' ? 'Навсегда' : subInfo.type === 'trial' ? 'Пробный период' : 'Pro') + (subInfo.until ? ' · до ' + subInfo.until : '') : 'Нет доступа'}</div>
    </div>
    ${!subInfo.ok ? `<div class="kicker mb-2">Тарифы</div>
    <p class="text-2xs text-muted mb-3">Оформление — только в боте @Echo_Planner_bot</p>` : ''}
    <button type="button" class="row pressable w-full text-left text-sm text-muted px-3 py-3" id="resetDemo">Сбросить демо</button>
  </div>`;
}
function bindSettings(){
  document.getElementById('backBtn')?.addEventListener('click',()=>{ state.tab='digest'; fullRender(); });
  document.getElementById('nameInput')?.addEventListener('change',e=>{ state.displayName=e.target.value; save(); });
  document.getElementById('budgetInput')?.addEventListener('change',e=>{ state.budget=Number(e.target.value)||0; save(); });
  document.getElementById('calInput')?.addEventListener('change',e=>{ state.calorieGoal=Number(e.target.value)||2500; save(); });
  document.getElementById('resetDemo')?.addEventListener('click',()=>{
    if(!confirm('Вернуть демо-данные?')) return;
    Object.assign(state, buildSeed()); save(); fullRender();
  });
}

/* ========== ARTHUR / PAYWALL ========== */
function renderArthur(){
  const el=document.getElementById('arthur');
  if(!state.arthurOpen){ el.classList.add('hidden'); return; }
  el.classList.remove('hidden');
  el.innerHTML=`
    <header class="flex items-center gap-2" style="padding:16px 12px 8px">
      <button type="button" class="pressable" id="arthurBack" style="width:36px;height:36px;display:grid;place-items:center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 5 L8 12 L15 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="flex-1">
        <div class="text-lg font-semibold tracking-tight">ARTHUR</div>
        <div class="text-2xs text-muted" style="letter-spacing:.12em;text-transform:uppercase">онлайн</div>
      </div>
    </header>
    <div class="flex-1 space-y-3" style="overflow-y:auto;padding:8px 16px;display:flex;flex-direction:column" id="chatBox">
      ${state.chat.map(m=>`<div class="${m.role==='user'?'bubble-user metal':'bubble-arthur card'}">${m.text}</div>`).join('')}
    </div>
    <form style="padding:8px 12px 16px" id="arthurForm">
      <div class="card flex items-end gap-2 p-2">
        <button type="button" class="size-11 flex items-center justify-center rounded-xl" id="micBtn" style="width:44px;height:44px" aria-label="Голос">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="9" y="3" width="6" height="11" rx="3" stroke="currentColor" stroke-width="1.7"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
        <input class="flex-1 text-sm" style="margin-bottom:8px;padding:4px 0" placeholder="Потратил 430 в кафе" id="arthurInput"/>
        <button type="submit" class="metal pressable flex items-center justify-center rounded-xl" style="width:44px;height:44px" aria-label="Отправить">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="#111" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </form>`;
  const box=document.getElementById('chatBox');
  box.scrollTop=box.scrollHeight;
  document.getElementById('arthurBack').onclick=()=>{ state.arthurOpen=false; fullRender(); };
  document.getElementById('arthurForm').onsubmit=(e)=>{
    e.preventDefault();
    const input=document.getElementById('arthurInput');
    const msg=input.value.trim(); if(!msg) return;
    input.value='';
    state.chat.push({id:uid('c'),role:'user',text:msg,ts:new Date().toISOString()});
    const result=localArthur(msg);
    applyEntries(result.entries);
    state.chat.push({id:uid('c'),role:'arthur',text:result.reply,ts:new Date().toISOString()});
    state.chat=state.chat.slice(-80); save();
    renderArthur();
  };
  document.getElementById('micBtn').onclick=()=>{
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){ state.chat.push({id:uid('c'),role:'arthur',text:'Голос здесь не слушается. Напиши текстом.',ts:new Date().toISOString()}); renderArthur(); return; }
    const r=new SR(); r.lang='ru-RU';
    r.onresult=(ev)=>{ const said=ev.results[0][0].transcript; if(said){ document.getElementById('arthurInput').value=said; document.getElementById('arthurForm').requestSubmit(); }};
    r.start();
  };
}
function renderPaywall(){
  const el=document.getElementById('paywall');
  if(!state.paywallOpen){ el.classList.add('hidden'); return; }
  el.classList.remove('hidden');
  el.innerHTML=`
    <div class="scroll" style="display:flex;flex-direction:column">
      <button type="button" class="text-sm text-muted" id="closePay" style="align-self:flex-start">Закрыть</button>
      <div class="mt-5 text-center">${markSVG(56)}
        <h2 class="text-3xl font-semibold tracking-tight mt-4">ECHO Pro</h2>
        <p class="mt-2 text-sm text-muted">Бесплатного тарифа нет.</p>
      </div>
      <button type="button" class="card pressable w-full text-left p-5 mt-5" data-plan="pro">
        <div class="kicker">Ежемесячно</div>
        <div class="mt-2 text-2xl font-semibold">250 ₽</div>
        <div class="metal mt-4 rounded-xl text-center text-xs font-semibold" style="padding:10px 0">Оформить Pro</div>
      </button>
      <button type="button" class="steel pressable w-full text-left p-5 mt-3" data-plan="forever">
        <div class="kicker">Один платёж</div>
        <div class="mt-2 text-2xl font-semibold">2 490 ₽</div>
        <div class="metal mt-4 rounded-xl text-center text-xs font-semibold" style="padding:10px 0">Купить навсегда</div>
      </button>
    </div>`;
  document.getElementById('closePay').onclick=()=>{ state.paywallOpen=false; fullRender(); };
  el.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{ state.plan=b.dataset.plan; state.paywallOpen=false; save(); fullRender(); });
}

/* ========== MAIN RENDER ========== */
function fullRender(){
  const map={
    digest:renderDigest, money:renderMoney, tasks:renderTasks,
    notes:renderNotes, meetings:renderMeetings, food:renderFood, settings:renderSettings
  };
  document.getElementById('main').innerHTML=(map[state.tab]||renderDigest)();
  renderDock();
  renderArthur();
  renderPaywall();
  animateProgressBars();

  // global digest clicks
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ state.tab=b.dataset.go; fullRender(); });
  document.getElementById('logoBtn')?.addEventListener('click',()=>{ state.arthurOpen=true; fullRender(); });

  if(state.tab==='tasks') bindTasks();
  else if(state.tab==='notes') bindNotes();
  else if(state.tab==='money') bindMoney();
  else if(state.tab==='meetings') bindMeetings();
  else if(state.tab==='food') bindFood();
  else if(state.tab==='settings') bindSettings();
  else {
    document.getElementById('backBtn')?.addEventListener('click',()=>{ state.tab='digest'; fullRender(); });
  }
}

try{
  const tg=window.Telegram?.WebApp;
  if(tg){ tg.ready(); tg.expand(); tg.setHeaderColor('#000000'); tg.setBackgroundColor('#000000');
    if(tg.initDataUnsafe?.user?.first_name) state.displayName=tg.initDataUnsafe.user.first_name;
  }
}catch{}

setTimeout(async ()=>{
  const splash = document.getElementById('splash');
  splash.classList.add('out');
  setTimeout(()=> splash.classList.add('hidden'), 560);

  subInfo = await fetchSubscription();
  if (!subInfo.ok && !subInfo.active) {
    showGate(subInfo);
    return;
  }
  hideGate();
  // sync plan label into local state for settings
  if (subInfo.type === 'lifetime') state.plan = 'forever';
  else if (subInfo.type === 'monthly') state.plan = 'pro';
  else if (subInfo.type === 'trial') state.plan = 'trial';
  fullRender();
}, 2200);
</script>
</body>
</html>
