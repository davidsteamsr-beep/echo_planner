          <div><div class="v num">${c.nutrition||0}</div><div class="l">Еда</div></div>
          <div><div class="v num">${c.notes||0}</div><div class="l">Заметки</div></div>
          <div><div class="v num">${u.payments ? u.payments.length : 0}</div><div class="l">Платежи</div></div>
        </div>
      </div>

      <div class="card p-4 mb-3 cab-anim" style="animation-delay:.1s">
        <div class="cab-line"><span class="t">Роль</span><span class="a">${roleName}</span></div>
        <div class="cab-line"><span class="t">Реферал</span><span class="a">${escHtml(u.referred_by || '—')}</span></div>
        <div class="cab-line"><span class="t">Создан</span><span class="a">${escHtml(String(u.created_at || '—').slice(0,10))}</span></div>
        <div class="cab-line"><span class="t">Подписка</span><span class="a">${subName}</span></div>
      </div>

      <div class="cab-sec" style="margin-top:18px"><span class="kicker">Платежи</span><span class="cab-count">${pays.length}</span></div>
      ${pays.map(p => `<div class="cab-line"><span class="t">${escHtml(payName(p.type))}</span><span class="a">${escHtml(String(p.at || '').slice(0,10))}</span></div>`).join('') || '<div class="cab-empty" style="padding:16px">Платежей нет</div>'}

      <div class="cab-sec" style="margin-top:18px"><span class="kicker">Последние финансы</span><span class="cab-count">${fin.length}</span></div>
      ${fin.map(x => `<div class="cab-line fin"><span class="a">${escHtml(x.description || x.title || 'Расход')}</span><span class="t">${escHtml(String(x.date || '').slice(0,10))} · ${money(Number(x.amount)||0)}</span></div>`).join('') || '<div class="cab-empty" style="padding:16px">Пока пусто</div>'}
      <div style="height:8px"></div>
    </div>`;
    bindHead(() => { state.cabinetView = fromPartner ? 'partner' : 'users'; fullRender(); }, 'cabClose', closeAll);
    return;
  }

  /* partner detail (owner only) */
  if (state.cabinetView === 'partner' && state.cabinetPartner) {
    const tr = state.cabinetPartner;
    const users = tr.users || [];
    const active = tr.active !== false;
    el.innerHTML = `<div class="scroll">
      ${cabHead('Партнёр', escHtml(tr.code || ''), 'partnerClose')}
      <div class="cab-profile cab-anim">
        ${cabAva(tr.name, tr.username, 'teal')}
        <div style="flex:1;min-width:0">
          <div class="nm">${escHtml(tr.name || tr.username || 'Партнёр')}</div>
          <div class="un">@${escHtml(tr.username || '—')}</div>
          <div class="mt-2">${active ? '<span class="cab-badge monthly">Активен</span>' : '<span class="cab-badge">Отключён</span>'}</div>
        </div>
      </div>

      <div class="cab-grid mb-3">
        ${cabMetric(null,'Клиенты',num(tr.users_count||0),'',0.05)}
        ${cabMetric(null,'Заработано',num(tr.earned||0)+' ₽','pro',0.08,true)}
        ${cabMetric(null,'Pro',num(tr.monthly||0),'pro',0.11)}
        ${cabMetric(null,'Навсегда',num(tr.lifetime||0),'life',0.14)}
      </div>

      <div class="card p-4 mb-4 cab-anim" style="animation-delay:.18s">
        <div class="flex items-center justify-between">
          <span class="kicker">Реф-ссылка</span>
          <span class="cab-badge monthly">${active ? 'активна' : 'выключена'}</span>
        </div>
        <div class="cab-ref mt-2">${escHtml(tr.ref_link || '')}</div>
        <button type="button" class="metal pressable w-full mt-3 py-3 text-sm font-semibold cab-btn-inline" id="copyPartnerRef">${icon('copy',16)} Скопировать</button>
      </div>

      <div class="cab-sec" style="margin-top:0"><span class="kicker">Клиенты</span><span class="cab-count">${users.length}</span></div>
      ${users.slice(0,40).map((u,i) => cabUserRow(u,i)).join('') || '<div class="cab-empty">У партнёра пока нет клиентов</div>'}

      <button type="button" class="cab-disable pressable" id="disablePartner">Отключить партнёра</button>
      <div class="text-2xs text-faint text-center mt-2 mb-4">Снимет безлимит, кабинет и остановит рефку</div>
    </div>`;
    bindHead(goHome, 'partnerClose', goHome);
    document.getElementById('copyPartnerRef')?.addEventListener('click', (e) => copyCab(tr.ref_link, e.currentTarget));
    el.querySelectorAll('[data-uid]').forEach(b => b.onclick = async () => {
      haptic('select');
      state.cabinetFrom = 'partner';
      try {
        state.cabinetDetail = await apiCab('/api/cabinet/user/' + b.dataset.uid);
        state.cabinetView = 'detail';
        fullRender();
      } catch (e) { alert('Ошибка загрузки'); }
    });
    const dis = document.getElementById('disablePartner');
    dis?.addEventListener('click', async () => {
      if (!confirm('Отключить партнёра @' + (tr.username || '') + '?\nРефка перестанет работать, безлимит и кабинет снимутся.')) return;
      dis.disabled = true;
      dis.textContent = 'Отключаем…';
      try {
        await apiCab('/api/cabinet/traffers/' + encodeURIComponent(tr.code) + '/disable', { method: 'POST', body: {} });
        state.cabinetData = await apiCab('/api/cabinet/overview');
        state.cabinetView = 'home';
        state.cabinetPartner = null;
        fullRender();
      } catch (e) {
        alert('Не удалось отключить');
        dis.disabled = false;
        dis.textContent = 'Отключить партнёра';
      }
    });
    return;
  }

  /* home */
  const ov = d.overview || {};
  const isOwner = d.role === 'owner';
  const total = ov.total || 0;
  const trial = ov.trial || 0;
  const monthly = ov.monthly || 0;
  const lifetime = ov.lifetime || 0;
  const inactive = ov.inactive != null ? ov.inactive : Math.max(0, total - trial - monthly - lifetime);
  const partners = d.traffers || [];
  const partnerRow = (tr, i) => `<button type="button" class="cab-person cab-anim" style="animation-delay:${0.26+i*0.04}s" data-partner="${escHtml(tr.code)}">
    ${cabAva(tr.name, tr.username, ['teal','amber',''][i%3])}
    <div class="meta">
      <div class="nm">${escHtml(tr.name || tr.username || 'Партнёр')}</div>
      <div class="un">@${escHtml(tr.username || '—')} · ${num(tr.users_count||0)} клиентов</div>
    </div>
    <div class="right"><div class="amt">${num(tr.earned||0)} ₽</div><div class="cnt">заработано</div></div>
    <span class="chev">${icon('arrow',15)}</span>
  </button>`;

  el.innerHTML = `<div class="scroll">
    ${cabHead('Кабинет', isOwner ? 'Владелец · вся база' : 'Партнёрская программа')}
    ${isOwner ? `
    <div class="hero cab-hero p-5 mb-3 cab-anim" style="animation-delay:.02s">
      <div class="flex justify-between items-center">
        <span class="kicker">Вся база</span>
        <span class="cab-chip">OWNER</span>
      </div>
      <div class="num mt-3" style="font-size:46px;font-weight:600;letter-spacing:-.05em;line-height:1">${num(total)}</div>
      <div class="text-sm mt-1" style="color:rgba(255,255,255,.8)">пользователей</div>
      <div class="cab-hero-foot">
        <span>${num(monthly + lifetime)} с подпиской</span>
        <span>${num(inactive)} без</span>
      </div>
    </div>
    <div class="cab-grid">
      ${cabMetric('all','Все',num(total),'',0.05)}
      ${cabMetric('trial','Триал',num(trial),'trial',0.08)}
      ${cabMetric('monthly','Pro',num(monthly),'pro',0.11)}
      ${cabMetric('lifetime','Навсегда',num(lifetime),'life',0.14)}
    </div>
    <button type="button" class="cab-wide pressable cab-anim" style="animation-delay:.17s" data-kind="inactive">
      <span class="dot"></span>
      <span>Без подписки</span>
      <span class="v num">${num(inactive)}</span>
      <span class="arr">${icon('arrow',14)}</span>
    </button>

    <div class="cab-sec"><span class="kicker">Партнёры</span><span class="cab-count">${partners.length}</span></div>
    ${partners.map(partnerRow).join('') || '<div class="cab-empty">Партнёров пока нет — добавьте первого</div>'}

    <button type="button" class="cab-add pressable" id="addTraffer">
      <span class="ico">${icon('plus',19)}</span>
      <span style="flex:1;min-width:0">
        <span class="tt" style="display:block">Добавить партнёра</span>
        <span class="ss" style="display:block">Telegram-аккаунт и имя</span>
      </span>
      <span class="arr">${icon('arrow',15)}</span>
    </button>
    <div class="text-2xs text-faint text-center mb-4">Данные синхронизированы с ботом</div>
    ` : `
    <div class="hero cab-hero cab-hero-partner p-5 mb-3 cab-anim" style="animation-delay:.02s">
      <div class="flex justify-between items-center">
        <span class="kicker">К выплате</span>
        <span class="cab-chip">PARTNER</span>
      </div>
      <div class="num mt-3" style="font-size:40px;font-weight:600;letter-spacing:-.05em;line-height:1">${num(d.earned||0)} ₽</div>
      <div class="text-sm mt-1" style="color:rgba(255,255,255,.82)">100 ₽ / мес · 1 100 ₽ / навсегда</div>
      <div class="cab-hero-foot">
        <span>${num(total)} клиентов</span>
        <span>${num(monthly + lifetime)} с подпиской</span>
      </div>
    </div>
    <div class="cab-grid">
      ${cabMetric('all','Все клиенты',num(total),'',0.05)}
      ${cabMetric('trial','Триал',num(trial),'trial',0.08)}
      ${cabMetric('monthly','Pro',num(monthly),'pro',0.11)}
      ${cabMetric('lifetime','Навсегда',num(lifetime),'life',0.14)}
    </div>
    <button type="button" class="cab-wide pressable cab-anim" style="animation-delay:.17s" data-kind="inactive">
      <span class="dot"></span>
      <span>Без подписки</span>
      <span class="v num">${num(inactive)}</span>
      <span class="arr">${icon('arrow',14)}</span>
    </button>

    ${d.ref_link ? `
    <div class="card p-4 mt-4 mb-4 cab-anim" style="animation-delay:.21s">
      <div class="flex items-center justify-between">
        <span class="kicker">Ваша ссылка</span>
        <span class="cab-badge monthly">активна</span>
      </div>
      <div class="cab-ref mt-2">${escHtml(d.ref_link)}</div>
      <button type="button" class="metal pressable w-full mt-3 py-3 text-sm font-semibold cab-btn-inline" id="copyRef">${icon('copy',16)} Скопировать ссылку</button>
    </div>` : ''}

    <div class="card p-4 mb-4 cab-anim" style="animation-delay:.25s">
      <div class="kicker mb-2">Как это работает</div>
      <div class="cab-note">Делитесь ссылкой — клиенты приходят в бота. Вы получаете <b>100 ₽</b> за каждую месячную подписку и <b>1 100 ₽</b> за пожизненную. Нажмите на карточку выше, чтобы посмотреть своих клиентов.</div>
    </div>
    <div class="text-2xs text-faint text-center mb-4">Выплаты считаются автоматически по оплатам клиентов</div>
    `}
  </div>
  ${isOwner ? `<div id="trafferModal" class="cab-modal-bg hidden">
    <div class="cab-modal">
      <div class="flex items-center justify-between">
        <div class="text-lg font-semibold">Новый партнёр</div>
        <button type="button" class="cab-x" id="trClose" aria-label="Закрыть">${icon('close',13)}</button>
      </div>
      <div class="text-2xs text-muted mt-1">Добавьте Telegram-аккаунт партнёра</div>
      <div class="cab-field">
        <label for="trUser">Username</label>
        <input id="trUser" placeholder="username без @" autocomplete="off" autocapitalize="off" />
      </div>
      <div class="cab-field">
        <label for="trName">Имя</label>
        <input id="trName" placeholder="Как зовут" autocomplete="off" />
      </div>
      <div class="flex gap-2 mt-4">
        <button type="button" class="card py-3 text-sm flex-1" id="trCancel">Отмена</button>
        <button type="button" class="metal pressable py-3 text-sm font-semibold flex-1" id="trOk">Добавить</button>
      </div>
    </div>
  </div>` : ''}`;

  bindHead(closeAll);

  el.querySelectorAll('[data-kind]').forEach(b => b.onclick = async () => {
    haptic('select');
    state.cabinetFilter = b.dataset.kind;
    state.cabinetFrom = 'users';
    try {
      const r = await apiCab('/api/cabinet/users?kind=' + encodeURIComponent(b.dataset.kind));
      state.cabinetUsers = r.users || [];
      state.cabinetView = 'users';
      fullRender();
    } catch (e) { alert('Не удалось загрузить список'); }
  });

  if (isOwner) {
    const modal = document.getElementById('trafferModal');
    const hide = () => modal?.classList.add('hidden');
    document.getElementById('addTraffer')?.addEventListener('click', () => {
      haptic('light');
      modal?.classList.remove('hidden');
      setTimeout(() => document.getElementById('trUser')?.focus(), 80);
    });
    document.getElementById('trCancel')?.addEventListener('click', hide);
    document.getElementById('trClose')?.addEventListener('click', hide);
    modal?.addEventListener('click', (e) => { if (e.target === modal) hide(); });
    document.getElementById('trOk')?.addEventListener('click', async () => {
      const username = (document.getElementById('trUser')?.value || '').trim().replace(/^@+/, '');
      const name = (document.getElementById('trName')?.value || '').trim();
      if (!username) { document.getElementById('trUser')?.focus(); return; }
      const btn = document.getElementById('trOk');
      if (btn) { btn.disabled = true; btn.textContent = 'Добавляем…'; }
      try {
        await apiCab('/api/cabinet/traffers', { method: 'POST', body: { username, name } });
        state.cabinetData = await apiCab('/api/cabinet/overview');
        fullRender();
      } catch (e) {
        alert('Ошибка добавления');
        if (btn) { btn.disabled = false; btn.textContent = 'Добавить'; }
      }
    });
    el.querySelectorAll('[data-partner]').forEach(b => b.onclick = async () => {
      haptic('select');
      try {
        state.cabinetPartner = await apiCab('/api/cabinet/traffers/' + encodeURIComponent(b.dataset.partner));
        state.cabinetView = 'partner';
        fullRender();
      } catch (e) {
        alert('Не удалось открыть партнёра');
      }
    });
  } else {
    const btn = document.getElementById('copyRef');
    if (btn) btn.onclick = () => copyCab(d.ref_link, btn);
  }
}

function fullRender(){
  const map={
    digest:renderDigest, money:renderMoney, tasks:renderTasks,
    notes:renderNotes, meetings:renderMeetings, food:renderFood, settings:renderSettings
  };
  try {
    document.getElementById('main').innerHTML=(map[state.tab]||renderDigest)();
  } catch (err) {
    console.error('render tab', state.tab, err);
    document.getElementById('main').innerHTML = '<div class="page p-4"><div class="card p-4"><div class="text-lg font-semibold">Ошибка экрана</div><div class="text-sm text-muted mt-2">'+(err&&err.message?err.message:err)+'</div><button type="button" class="steel pressable w-full mt-4 py-3 text-sm" id="retryDigest">На главный</button></div></div>';
    setTimeout(()=>document.getElementById('retryDigest')?.addEventListener('click',()=>{ state.tab='digest'; try{ fullRender(); }catch(e){} }), 0);
  }
  renderDock();
  renderMoreSheet();
  renderArthur();
  renderPaywall();
  try{renderCabinet();}catch(e){}
  animateProgressBars();

  // global digest clicks
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ haptic('select'); state.moreOpen=false; state.arthurOpen=false; state.tab=b.dataset.go; fullRender(); });
  document.getElementById('logoBtn')?.addEventListener('click',()=>{ haptic('light'); state.arthurOpen=true; fullRender(); });
  document.getElementById('headArthur')?.addEventListener('click',()=>{ haptic('light'); state.arthurOpen=true; fullRender(); });

  if(state.tab==='tasks') bindTasks();
  else if(state.tab==='notes') bindNotes();
  else if(state.tab==='money') bindMoney();
  else if(state.tab==='meetings') bindMeetings();
  else if(state.tab==='food') bindFood();
  else if(state.tab==='settings') bindSettings();
  else {
    document.getElementById('backBtn')?.addEventListener('click',()=>{ state.tab='digest'; fullRender(); });
  }
  document.getElementById('openCabinet')?.addEventListener('click', () => openCabinet());
  try { renderCabinet(); } catch(e) { console.error(e); }
}

try{
  const tg=window.Telegram?.WebApp;
  if(tg){ tg.ready(); tg.expand();
    try { tg.setHeaderColor('#08090b'); tg.setBackgroundColor('#08090b'); } catch(e) {}
    try { tg.setBottomBarColor?.('#08090b'); } catch(e) {}
    if(tg.initDataUnsafe?.user?.first_name) state.displayName=tg.initDataUnsafe.user.first_name;
  }
}catch{}

document.addEventListener('pointerdown', (e)=>{
  try {
    if(e.target.closest('.pressable,[data-tab],[data-more],.check,.cal-cell,.chip,.sugg,.dock-item,.sheet-item,.tile,.avatar-btn,.back-btn')) haptic('light');
  } catch(err) {}
}, {passive:true});

setTimeout(async ()=>{
  const splash = document.getElementById('splash');
  try { splash?.classList.add('out'); } catch(e) {}
  setTimeout(()=> { try { splash?.classList.add('hidden'); } catch(e) {} }, 400);

  const tgUser = (() => { try { return window.Telegram?.WebApp?.initDataUnsafe?.user; } catch(e) { return null; } })();
  const uname = (tgUser?.username || '').toLowerCase();
  const isOwnerClient = (uname === 'dvvsww');

  try {
    subInfo = await fetchSubscription();
  } catch (e) {
    console.error(e);
    subInfo = { active: false, ok: false, serverError: true };
  }

  if (isOwnerClient) {
    roleInfo = { role: 'owner', is_owner: true, is_traffer: false, traffer_code: null };
    subInfo = { ...(subInfo||{}), ok: true, active: true, type: subInfo?.type || 'lifetime' };
    try { document.getElementById('ownerBadge')?.classList.remove('hidden'); } catch(e) {}
  } else if (roleInfo.is_owner) {
    try { document.getElementById('ownerBadge')?.classList.remove('hidden'); } catch(e) {}
  }

  try {
    // owner всегда внутрь; остальным — проверка подписки
    if (!isOwnerClient && !roleInfo.is_owner && !subInfo.ok && !subInfo.active) {
      showGate(subInfo);
      return;
    }
    hideGate();
    if (subInfo.type === 'lifetime') state.plan = 'forever';
    else if (subInfo.type === 'monthly') state.plan = 'pro';
    else if (subInfo.type === 'trial') state.plan = 'trial';
    if (isOwnerClient) state.plan = 'forever';

    // гарантируем массивы перед отрисовкой
    ['expenses','meetings','tasks','meals','notes','chat'].forEach(k => {
      if (!Array.isArray(state[k])) state[k] = [];
    });
    if (!state.calorieGoal) state.calorieGoal = 2000;
    if (state.budget == null || isNaN(state.budget)) state.budget = 0;

    fullRender();
  } catch (e) {
    console.error('boot UI', e);
    hideGate();
    const main = document.getElementById('main');
    if (main) {
      main.innerHTML = '<div class="page" style="padding:24px"><div class="card p-4"><div class="text-lg font-semibold">Сбой загрузки</div><div class="text-sm text-muted mt-2">'+String(e&&e.message||e)+'</div><button type="button" class="steel pressable w-full mt-4 py-3 text-sm" id="forceDigest">Открыть DIGEST</button></div></div>';
      document.getElementById('forceDigest')?.addEventListener('click', () => {
        state.tab = 'digest';
        try { fullRender(); } catch(err) { console.error(err); }
      });
    }
    try { renderDock(); } catch(e2) {}
  }
}, 1600);
</script>
</body>
</html>
