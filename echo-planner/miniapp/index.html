<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ECHO Planner</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <div class="logo-mark">E</div>
        <span class="logo-text">ECHO Planner</span>
      </div>
      <div class="sub-badge" id="subBadge">Free</div>
    </header>

    <!-- Dashboard -->
    <main id="dashboard" class="screen active">
      <div class="sections">
        <button class="section-btn" data-section="finance">
          <span class="icon">💰</span>
          <span class="label">Финансы</span>
          <span class="stat" id="statFinance">—</span>
        </button>
        <button class="section-btn" data-section="calendar">
          <span class="icon">📅</span>
          <span class="label">Календарь</span>
          <span class="stat" id="statCalendar">—</span>
        </button>
        <button class="section-btn" data-section="tasks">
          <span class="icon">✅</span>
          <span class="label">Задачи</span>
          <span class="stat" id="statTasks">—</span>
        </button>
        <button class="section-btn" data-section="nutrition">
          <span class="icon">🍽</span>
          <span class="label">Питание</span>
          <span class="stat" id="statNutrition">—</span>
        </button>
      </div>
    </main>

    <!-- Section screens -->
    <main id="section-screen" class="screen">
      <div class="section-header">
        <button class="back-btn" id="backBtn">←</button>
        <h2 id="sectionTitle">Раздел</h2>
      </div>
      <div class="stats-row" id="sectionStats"></div>
      <div class="list" id="sectionList"></div>
    </main>

    <!-- ARTHUR Chat -->
    <main id="chat-screen" class="screen">
      <div class="section-header">
        <button class="back-btn" id="chatBackBtn">←</button>
        <h2>ARTHUR</h2>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-wrap">
        <input type="text" id="chatInput" placeholder="Спроси ARTHUR..." autocomplete="off" />
        <button id="sendBtn">↑</button>
      </div>
    </main>

    <!-- Bottom ARTHUR button -->
    <button id="arthurBtn" class="arthur-btn" title="ARTHUR">
      <span>A</span>
    </button>
  </div>

  <script src="app.js"></script>
</body>
</html>
